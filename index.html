// Scoped to whatever the Analytics tab is currently showing (All Portfolios vs one portfolio).
// Shared by analyticsHTML() and by targeted partial refreshes (toggles) so they never drift apart.
function analyticsScopedInv(){
  return currentPortfolio==='all'
    ?getAllInvestments()
    :pData(currentPortfolio).investments.map(i=>({...i,_pid:currentPortfolio,_pname:pInfo(currentPortfolio).name,_pcolor:pInfo(currentPortfolio).color}));
}
function analyticsScopedPay(){
  return currentPortfolio==='all'
    ?getAllPayments()
    :pData(currentPortfolio).payments.map(p=>({...p,_pid:currentPortfolio}));
}
function maturityDate(inv){
  if(!inv.date||!inv.duration) return null;
  const d=new Date(inv.date);
  d.setMonth(d.getMonth()+Number(inv.duration));
  return d;
}
function isOverdue(inv,pid){
  pid=pid||inv._pid;
  const m=maturityDate(inv);
  return m&&m<new Date()&&principalOutstanding(pid,inv)>0&&effectiveStatus(pid,inv)==='Active';
}
function collectionRate(inv){
  const expected=Number(inv.deployed)+expectedProfit(inv);
  const received=invPaymentsFor(inv._pid,inv.id).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
  return expected>0?Math.min(100,(received/expected)*100):0;
}
function ragColor(pct){
  if(pct>=75) return 'var(--green)';
  if(pct>=30) return 'var(--gold)';
  return 'var(--red)';
}
function kpiCard(label,value,color){
  return '<div class="stat-card">'
    +'<div style="font-size:18px;font-weight:800;color:'+color+';line-height:1.1">'+value+'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+label+'</div>'
    +'</div>';
}

// Standalone so the Actual/Forecast toggle can rebuild just this one chart without touching
// (or destroying) any of the other charts on the page.
function renderMonthlyChart(){
  const allInv=analyticsScopedInv();
  const allPay=analyticsScopedPay();
  const gc='rgba(48,54,61,0.8)';
  const now0=new Date();
  const monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const monthLbl=d=>d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
  let mLabels,mValues,mColor;
  if(anlMonthlyMode==='forecast'){
    const months=[];for(let i=0;i<12;i++)months.push(new Date(now0.getFullYear(),now0.getMonth()+i,1));
    const buckets={};months.forEach(m=>buckets[monthKey(m)]=0);
    const firstKey=monthKey(months[0]),lastMonthStart=months[0];
    allInv.forEach(inv=>{
      if(effectiveStatus(inv._pid,inv)!=='Active')return;
      const out=outstandingFor(inv._pid,inv);
      if(out<=0.01)return;
      const mat=maturityDate(inv);
      if(!mat)return;
      if(mat<lastMonthStart){buckets[firstKey]+=out;return;}
      const key=monthKey(mat);
      if(buckets[key]!==undefined)buckets[key]+=out;
    });
    mLabels=months.map(m=>monthLbl(m));
    mValues=months.map(m=>+buckets[monthKey(m)].toFixed(2));
    mColor='#C9A84C88';
  }else{
    const months=[];for(let i=11;i>=0;i--)months.push(new Date(now0.getFullYear(),now0.getMonth()-i,1));
    const monthly={};
    allPay.filter(p=>Number(p.principal||0)+Number(p.profit||0)>0).forEach(p=>{
      const key=p.date.slice(0,7);
      monthly[key]=(monthly[key]||0)+Number(p.principal||0)+Number(p.profit||0);
    });
    mLabels=months.map(m=>monthLbl(m));
    mValues=months.map(m=>+((monthly[monthKey(m)]||0).toFixed(2)));
    mColor='#58A6FF88';
  }
  const c6=document.getElementById('anl-monthly');
  if(c6){
    if(anlChartInstances.monthly){try{anlChartInstances.monthly.destroy();}catch(e){}}
    anlChartInstances.monthly=new Chart(c6,{type:'bar',data:{
      labels:mLabels,
      datasets:[{data:mValues,backgroundColor:mColor,borderRadius:4,borderSkipped:false}]
    },options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' OMR '+ctx.raw.toLocaleString()}}},
      scales:{x:{grid:{color:gc},ticks:{font:{size:9}}},y:{grid:{color:gc},ticks:{callback:v=>'OMR '+Number(v).toLocaleString()}}}}});
  }
}

function cashFlowBuckets(invs){
  const now=new Date();
  const b={overdue:0,d0_30:0,d31_60:0,d61_90:0,beyond90:0};
  const items={overdue:[],d0_30:[],d31_60:[],d61_90:[],beyond90:[]};
  invs.forEach(i=>{
    if(effectiveStatus(i._pid,i)!=='Active')return;
    const out=outstandingFor(i._pid,i);
    if(out<=0.01)return;
    const mat=maturityDate(i);
    let key;
    if(!mat)key='beyond90';
    else{
      const days=Math.ceil((mat-now)/86400000);
      key=days<0?'overdue':days<=30?'d0_30':days<=60?'d31_60':days<=90?'d61_90':'beyond90';
    }
    b[key]+=out;
    items[key].push({inv:i,out,mat});
  });
  Object.keys(items).forEach(k=>items[k].sort((a,b2)=>b2.out-a.out));
  return{buckets:b,items};
}
function cashFlowHTML(data){
  const b=data.buckets,items=data.items;
  const rows=[
    {key:'overdue',label:'Overdue',val:b.overdue,color:'var(--red)'},

    const list=items[r.key];

      +'</div>').join(''):'<div style="color:var(--muted);font-size:11px;padding:6px 0 6px 8px">No deals in this window</div>')+'</div>':'';
    return'<div style="margin-bottom:10px;cursor:pointer" onclick="toggleCashFlowBucket(\''+r.key+'\')">'

// COLLECTIONS / AGING
// Two focused lists for follow-up: deals already past maturity with money still outstanding,
// and deals maturing within 30 days that still have an outstanding balance (early warning).
function collectionsList(invs){
  const now=new Date();
  const overdue=[],upcoming=[];
  invs.forEach(i=>{
    if(effectiveStatus(i._pid,i)!=='Active')return;
    const out=outstandingFor(i._pid,i);
    const mat=maturityDate(i);
    if(out<=0.01||!mat)return;
    const days=Math.ceil((mat-now)/86400000);
    if(days<0)overdue.push({...i,_days:days,_out:out});
    else if(days<=30)upcoming.push({...i,_days:days,_out:out});
  });
  overdue.sort((a,b)=>a._days-b._days);
  upcoming.sort((a,b)=>a._days-b._days);
  return{overdue,upcoming};
}
function collectionsHTML(list){
  const row=i=>{
    const late=i._days<0;
    const band=late?'var(--red)':'var(--gold)';
    const label=late?Math.abs(i._days)+'d overdue':i._days+'d left';
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openDetail(${i.id},'${i._pid}')">
      <div><div style="color:var(--text);font-size:13px;font-weight:600">${i.company}</div>
      <div style="color:var(--muted);font-size:11px">${i._pname||pInfo(i._pid).name} · ${fmtMonthYear(maturityDate(i))}</div></div>
      <div style="text-align:right"><div style="color:var(--gold);font-size:13px;font-weight:700">${fmt(i._out)}</div>
      <div style="color:${band};font-size:11px">${label}</div></div></div>`;
  };
  let html='';
  if(list.overdue.length)html+='<div style="color:var(--red);font-size:12px;font-weight:700;margin-bottom:4px">⚠ Overdue ('+list.overdue.length+')</div>'+list.overdue.map(row).join('');
  if(list.upcoming.length)html+='<div style="color:var(--gold);font-size:12px;font-weight:700;margin:'+(list.overdue.length?'14px':'0')+' 0 4px">Maturing in 30 Days ('+list.upcoming.length+')</div>'+list.upcoming.map(row).join('');
  if(!list.overdue.length&&!list.upcoming.length)html='<div class="empty">Nothing overdue or maturing soon</div>';
  return html;
}

// DATA HEALTH — duplicate & anomaly detection
// Scans across all portfolios and flags things worth double-checking: possible duplicate
// entries, overpayments vs. expected return, orphaned payments, and missing/invalid fields.
function dataHealthChecks(){
  const issues=[];
  const allInv=[];
  state.portfolios.forEach(p=>{
    pData(p.id).investments.forEach(inv=>allInv.push({...inv,_pid:p.id,_pname:p.name}));
  });

  // Possible duplicate deals: same portfolio, same company, same start date
  const seen=new Map();
  allInv.forEach(inv=>{
    const key=inv._pid+'|'+(inv.company||'').trim().toLowerCase()+'|'+inv.date;
    if(!seen.has(key))seen.set(key,[]);
    seen.get(key).push(inv);
  });
  seen.forEach(group=>{
    if(group.length>1){
      issues.push({severity:'warning',pid:group[0]._pid,invId:group[0].id,
        message:group.length+' deals with identical company + start date in '+group[0]._pname+': "'+group[0].company+'" on '+fmtDate(group[0].date)+'. Could be a duplicate entry.'});
    }
  });

  // Overpayment: total received exceeds expected total return
  allInv.forEach(inv=>{
    const totalPaid=invPaymentsFor(inv._pid,inv.id).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
    const expTotal=Number(inv.deployed)+expectedProfit(inv);
    if(totalPaid>expTotal+0.5){
      issues.push({severity:'error',pid:inv._pid,invId:inv.id,
        message:'"'+inv.company+'" ('+inv._pname+') has received '+fmtHealth(totalPaid)+', more than its expected total return of '+fmtHealth(expTotal)+'. Delta: '+fmtHealth(totalPaid-expTotal)+'. Check for a data entry mistake.'});
    }
  });

  // Residual balance: deal looks essentially fully collected (rounds to 100% in the UI) but a
  // small non-zero amount remains outstanding — this is exactly what keeps it Active/Overdue
  // instead of auto-closing, and it's invisible unless shown unrounded.
  allInv.forEach(inv=>{
    if(effectiveStatus(inv._pid,inv)!=='Active')return;
    const out=outstandingFor(inv._pid,inv);
    if(out>0&&out<=Math.max(1,Number(inv.deployed)*0.02)){
      const late=isOverdue(inv,inv._pid);
      issues.push({severity:late?'error':'warning',pid:inv._pid,invId:inv.id,
        message:'"'+inv.company+'" ('+inv._pname+') is '+(late?'OVERDUE with':'nearly fully collected —')+' an exact outstanding balance of '+fmtHealth(out)+' (rounds to 100% in the Collected column, so it looks done but is not). Add or correct a payment to close it out.'});
    }
  });

  // Closed but principal not fully recovered: the deal auto-closes because total money in
  // (principal + profit combined) meets the total expected, but the principal-specific tracker
  // still shows a shortfall — meaning some of what came in was booked as profit when part of it
  // may actually be principal, or vice versa. Worth checking regardless of how small the gap is.
  allInv.forEach(inv=>{
    if(effectiveStatus(inv._pid,inv)!=='Closed')return;
    const pOut=principalOutstanding(inv._pid,inv);
    if(pOut>0.01){
      const actProf=actualProfit(inv._pid,inv),expProf=expectedProfit(inv);
      issues.push({severity:'warning',pid:inv._pid,invId:inv.id,
        message:'"'+inv.company+'" ('+inv._pname+') shows Closed overall, but '+fmtHealth(pOut)+' of principal is technically still outstanding — offset by profit received ('+fmtHealth(actProf)+') running ahead of expected ('+fmtHealth(expProf)+'). Check whether a payment was logged under the wrong category (principal vs profit).'});
    }
  });

  // Missing / invalid core fields
  allInv.forEach(inv=>{
    const probs=[];
    if(!inv.company||!inv.company.trim())probs.push('missing company name');
    if(!(Number(inv.deployed)>0))probs.push('invalid capital amount');
    if(!(Number(inv.roi)>0))probs.push('missing or zero ROI');
    if(!(Number(inv.duration)>0))probs.push('missing duration');
    if(!inv.date)probs.push('missing start date');
    if(probs.length){
      issues.push({severity:'warning',pid:inv._pid,invId:inv.id,
        message:'"'+(inv.company||'Unnamed deal')+'" ('+inv._pname+'): '+probs.join(', ')+'.'});
    }
  });

  // Orphaned payments: reference an investmentId that no longer exists
  state.portfolios.forEach(p=>{
    const pd=pData(p.id);
    const validIds=new Set(pd.investments.map(i=>i.id));
    pd.payments.forEach(pay=>{
      if(!validIds.has(pay.investmentId)){
        issues.push({severity:'error',pid:p.id,invId:null,
          message:'Payment of '+fmtHealth(Number(pay.principal||0)+Number(pay.profit||0))+' on '+fmtDate(pay.date)+' in '+p.name+' references a deal that no longer exists (possibly deleted).'});
      }
    });
  });

  return issues;
}

// ═══════════════════════════════════════════════════════════════
// PASSWORD / LOCK ENGINE
// ═══════════════════════════════════════════════════════════════
const PWD_KEY = 'ipt_pwd_v1'; // legacy 32-bit hash — only read to migrate, then removed
const PWD_REC_KEY = 'ipt_pwd_v2';
const BIO_KEY = 'ipt_bio';
const AUTOLOCK_KEY = 'ipt_autolock';
const DEFAULT_PWD = '1234Abc';
const PBKDF2_ITER = 310000;
const HAS_SUBTLE = !!(window.crypto && crypto.subtle);
let _unlocked = false;
// KEY MODEL — secrets (the Gist token) are encrypted with one random AES-GCM "data key". That data
// key is stored only in wrapped (encrypted) form, once per unlock method:
//   • wrapped by a key derived from the password (PBKDF2)          → ipt_pwd_v2.dekWrap
//   • wrapped by a key from the biometric passkey (WebAuthn PRF)   → ipt_bio.dekWrap
// Either method can unwrap it, and changing the password only re-wraps it — nothing else changes.
// The unwrapped data key lives in memory only while the app is unlocked.
let _sessionKey = null;

// Legacy hash — kept only to verify passwords set before the PBKDF2 upgrade (or when WebCrypto is
// unavailable, e.g. plain-http hosting).
function hashPwd(pwd){
  let h = 0;
  for(let i = 0; i < pwd.length; i++){
    h = Math.imul(31, h) + pwd.charCodeAt(i) | 0;
  }
  return 'h' + Math.abs(h).toString(36);
}
function getStoredHash(){
  return localStorage.getItem(PWD_KEY) || hashPwd(DEFAULT_PWD);
}

function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function unb64(s){return Uint8Array.from(atob(s), c => c.charCodeAt(0));}
function b64url(buf){return b64(buf).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s);}
function loadPwdRecord(){
  try{ const r = JSON.parse(localStorage.getItem(PWD_REC_KEY)); return r && r.salt && r.hash ? r : null; }
  catch(e){ return null; }
}
// PBKDF2-SHA256 → 512 bits: the first half is stored as the verifier, the second half is the key
// that wraps the data key. Neither the key half nor the password is written anywhere.
async function derivePwd(pwd, saltBytes, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:saltBytes, iterations:iter}, base, 512));
  const kek = await crypto.subtle.importKey('raw', bits.slice(32), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
  return { hash: b64(bits.slice(0, 32)), kek };
}
function newDataKey(){ return crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); }
async function wrapKey(kek, dek){ return encryptWith(kek, new Uint8Array(await crypto.subtle.exportKey('raw', dek))); }
async function unwrapKey(kek, wrap){
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(wrap.iv)}, kek, unb64(wrap.ct));
  return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
}
async function encryptWith(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes);
  return { iv: b64(iv), ct: b64(ct) };
}
async function createPwdRecord(pwd, dek){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const d = await derivePwd(pwd, salt, PBKDF2_ITER);
  localStorage.setItem(PWD_REC_KEY, JSON.stringify({ salt: b64(salt), iter: PBKDF2_ITER, hash: d.hash, isDefault: pwd === DEFAULT_PWD, dekWrap: await wrapKey(d.kek, dek) }));
  localStorage.removeItem(PWD_KEY);
}
// Returns {ok, key} where key is the data key. Upgrades older records transparently:
//   legacy 32-bit hash        → new PBKDF2 record with a fresh data key
//   PBKDF2 without a data key → token was encrypted with the password key itself; re-encrypt it
//                               under a fresh data key and store that key wrapped
async function verifyPwd(pwd){
  const rec = HAS_SUBTLE ? loadPwdRecord() : null;
  if(rec){
    const d = await derivePwd(pwd, unb64(rec.salt), rec.iter || PBKDF2_ITER);
    if(d.hash !== rec.hash) return { ok: false };
    if(rec.dekWrap) return { ok: true, key: await unwrapKey(d.kek, rec.dekWrap) };
    const dek = await newDataKey();
    if(syncConfig.tokenEnc){
      try{ syncConfig.token = await decryptSecret(syncConfig.tokenEnc, d.kek); syncConfig.tokenEnc = await encryptSecret(syncConfig.token, dek); saveSyncConfig(syncConfig); }
      catch(e){ console.warn('Could not migrate the Gist token:', e); }
    }
    rec.dekWrap = await wrapKey(d.kek, dek);
    localStorage.setItem(PWD_REC_KEY, JSON.stringify(rec));
    return { ok: true, key: dek };
  }
  if(hashPwd(pwd) !== getStoredHash()) return { ok: false };
  if(!HAS_SUBTLE) return { ok: true, key: null };
  const dek = await newDataKey();
  await createPwdRecord(pwd, dek);
  return { ok: true, key: dek };
}
function isDefaultPwd(){
  const rec = loadPwdRecord();
  if(rec) return !!rec.isDefault;
  return !localStorage.getItem(PWD_KEY);
}

async function encryptSecret(text, key){ return encryptWith(key || _sessionKey, new TextEncoder().encode(text)); }
async function decryptSecret(enc, key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(enc.iv)}, key || _sessionKey, unb64(enc.ct));
  return new TextDecoder().decode(pt);
}
// After unlock: decrypt the stored Gist token into memory, or encrypt a legacy plaintext one.
async function unlockSyncToken(){
  if(!_sessionKey) return;
  try{
    if(syncConfig.tokenEnc) syncConfig.token = await decryptSecret(syncConfig.tokenEnc);
    else if(syncConfig.token){ syncConfig.tokenEnc = await encryptSecret(syncConfig.token); saveSyncConfig(syncConfig); }
  }catch(e){
    console.warn('Could not decrypt the Gist token:', e);
    syncConfig.token = ''; syncConfig.tokenEnc = null; saveSyncConfig(syncConfig);
    showToast('Gist token could not be decrypted — reconnect in Setup', true);
  }
}
// Some actions need the data key (connecting or using Gist sync). After a biometric unlock without
// PRF support the key isn't in memory, so ask for the password once and keep it for the session.
async function ensureSessionKey(reason){
  if(_sessionKey || !HAS_SUBTLE) return true;
  const pwd = await askPassword('Enter your password', reason);
  if(pwd == null) return false;
  const res = await verifyPwd(pwd);
  if(!res.ok){ showToast('Incorrect password', true); return false; }
  _sessionKey = res.key;
  await unlockSyncToken();
  return true;
}
let _askResolve = null;
function askPassword(title, message){
  return new Promise(resolve => {
    _askResolve = resolve;
    showModal(`<div class="modal-handle"></div><div class="modal-title">${escHTML(title)}</div>

      <button class="btn btn-gold" onclick="submitAskPassword()">Continue</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`);
    setTimeout(() => { const i = document.getElementById('ask-pwd'); if(i) i.focus(); }, 50);
  });
}
function submitAskPassword(){
  const v = document.getElementById('ask-pwd').value;
  if(!v){ showToast('Enter your password', true); return; }
  const r = _askResolve; _askResolve = null;
  document.getElementById('modal').style.display = 'none';
  if(r) r(v);
}

// Shared by password and biometric unlock
async function finishUnlock(key){
  _sessionKey = key;
  await unlockSyncToken();
  try{ await loadSecureData(); }
  catch(e){
    console.error('Could not decrypt app data:', e);
    _sessionKey = null; wipeSecureData();
    document.getElementById('lock-error').textContent = HAS_SUBTLE ? 'Could not decrypt your data on this device' : 'Your data is encrypted — open the app from its secure (https) address';
    return;
  }
  migratePaymentsIfNeeded();
  _unlocked = true;
  markActive();
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('lock-error').textContent = '';
  render();
  if(isDefaultPwd()) showToast('You are using the default password — change it in Setup', true);
}
async function doUnlock(){
  const inp = document.getElementById('lock-input');
  const err = document.getElementById('lock-error');
  const val = inp.value;
  if(!val){ err.textContent = 'Please enter your password'; return; }
  err.textContent = 'Checking…';
  let res;
  try{ res = await verifyPwd(val); }
  catch(e){ console.error(e); err.textContent = 'Could not verify password'; return; }
  if(res.ok){
    inp.value = '';
    await finishUnlock(res.key);
  } else {
    err.textContent = 'Incorrect password — try again';
    inp.value = '';
    inp.classList.add('shake');
    setTimeout(() => inp.classList.remove('shake'), 500);
    inp.focus();
  }
}

// ═══════════════════════════════════════════════════════════════
// BIOMETRIC UNLOCK (WebAuthn passkey on this device's fingerprint / face sensor)
// Needs a secure page (https or localhost) and a platform authenticator. Where the authenticator
// supports the PRF extension, the passkey also yields a secret that unwraps the data key, so a
// fingerprint unlocks everything. Without PRF it unlocks the app only, and Gist sync asks for the
// password once per session. There is no server here, so the assertion is checked on the device:
// challenge, origin, the "user verified" flag and the signature against the stored public key.
// ═══════════════════════════════════════════════════════════════
let _bioPlatform = null; // null = still checking, then true/false
let _bioInFlight = false;
function loadBio(){ try{ const r = JSON.parse(localStorage.getItem(BIO_KEY)); return r && r.credId ? r : null; }catch(e){ return null; } }
function bioApiPresent(){ return HAS_SUBTLE && window.isSecureContext && !!window.PublicKeyCredential && !!navigator.credentials; }
(async () => {
  try{ _bioPlatform = bioApiPresent() && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ _bioPlatform = false; }
  updateLockHint();
  if(_unlocked && currentTab === 'setup') render();
})();
async function prfToKey(out){ return crypto.subtle.importKey('raw', new Uint8Array(out).slice(0, 32), {name:'AES-GCM'}, false, ['encrypt','decrypt']); }
// WebAuthn ES256 signatures are DER-encoded; WebCrypto expects raw r||s (32 bytes each)
function derToRawSig(der){
  let p = 2; if(der[1] & 0x80) p += der[1] & 0x7f;
  const read = () => { p++; const len = der[p++]; let v = der.slice(p, p + len); p += len;
    while(v.length > 32 && v[0] === 0) v = v.slice(1);
    const out = new Uint8Array(32); out.set(v, 32 - v.length); return out; };
  const r = read(), s = read(), raw = new Uint8Array(64); raw.set(r, 0); raw.set(s, 32); return raw;
}
async function verifyAssertionSig(rec, resp){
  if(!rec.pubKey || (rec.alg !== -7 && rec.alg !== -257)) return true; // no key recorded: rely on UV flag
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', resp.clientDataJSON));
  const ad = new Uint8Array(resp.authenticatorData), data = new Uint8Array(ad.length + hash.length);
  data.set(ad, 0); data.set(hash, ad.length);
  const sig = new Uint8Array(resp.signature);
  if(rec.alg === -7){
    const k = await crypto.subtle.importKey('spki', unb64(rec.pubKey), {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    return crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, k, derToRawSig(sig), data);
  }
  const k = await crypto.subtle.importKey('spki', unb64(rec.pubKey), {name:'RSASSA-PKCS1-v1_5', hash:'SHA-256'}, false, ['verify']);
  return crypto.subtle.verify('RSASSA-PKCS1-v1_5', k, sig, data);
}
// Runs the fingerprint / face prompt and checks the result. Returns the PRF output, if any.
async function bioAssert(rec){
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const opts = { challenge, allowCredentials: [{type:'public-key', id: unb64url(rec.credId)}], userVerification: 'required', timeout: 60000 };
  if(rec.prf) opts.extensions = { prf: { eval: { first: unb64(rec.prfSalt) } } };
  const a = await navigator.credentials.get({ publicKey: opts });
  const cd = JSON.parse(new TextDecoder().decode(a.response.clientDataJSON));
  if(cd.type !== 'webauthn.get' || cd.challenge !== b64url(challenge) || cd.origin !== location.origin) throw new Error('Biometric response did not match this request');
  if(!(new Uint8Array(a.response.authenticatorData)[32] & 0x04)) throw new Error('The device did not confirm your fingerprint or face');
  if(!(await verifyAssertionSig(rec, a.response))) throw new Error('Biometric signature check failed');
  const ext = a.getClientExtensionResults ? a.getClientExtensionResults() : {};
  return ext.prf && ext.prf.results ? ext.prf.results.first : null;
}
async function doBioUnlock(){
  const rec = loadBio();
  if(!rec || _bioInFlight || _unlocked) return;
  const err = document.getElementById('lock-error');
  if(!rec.prf){ err.textContent = 'This device\'s fingerprint can\'t decrypt your data — use your password, then turn biometric unlock off and on again in Setup'; return; }
  _bioInFlight = true;
  err.textContent = '';
  try{
    const out = await bioAssert(rec);
    let key = null;
    if(rec.prf && rec.dekWrap){
      if(!out) throw new Error('Your device did not return the unlock secret — use your password');
      key = await unwrapKey(await prfToKey(out), rec.dekWrap);
    }
    await finishUnlock(key);
  }catch(e){
    console.warn('Biometric unlock failed:', e);
    err.textContent = e.name === 'NotAllowedError' ? 'Fingerprint / face cancelled — tap to try again, or use your password' : (e.message || 'Biometric unlock failed — use your password');
  }finally{ _bioInFlight = false; }
}
async function enableBio(){
  if(!bioApiPresent() || !_bioPlatform){ showToast('Biometric unlock is not available on this device or page', true); return; }
  const pwd = await askPassword('Turn on biometric unlock', 'Confirm your password. Your phone will then ask for your fingerprint or face to create a passkey for this app.');
  if(pwd == null) return;
  const res = await verifyPwd(pwd);
  if(!res.ok){ showToast('Incorrect password', true); return; }
  if(res.key) _sessionKey = res.key;
  _bioInFlight = true;
  try{
    const prfSalt = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Portfolio Tracker' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'portfolio-tracker', displayName: 'Portfolio Tracker' },
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      timeout: 60000, attestation: 'none',
      extensions: { prf: { eval: { first: prfSalt } } },
    }});
    const r = cred.response;
    const pub = r.getPublicKey ? r.getPublicKey() : null;
    const rec = { credId: b64url(cred.rawId), prf: false, prfSalt: b64(prfSalt), pubKey: pub ? b64(pub) : null, alg: r.getPublicKeyAlgorithm ? r.getPublicKeyAlgorithm() : null, createdAt: new Date().toISOString(), dekWrap: null };
    const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    if(ext.prf && ext.prf.enabled && res.key){
      // Some authenticators return the PRF secret at creation; otherwise one more prompt fetches it
      let out = ext.prf.results && ext.prf.results.first;
      if(!out){ rec.prf = true; try{ out = await bioAssert(rec); }catch(e){ console.warn('PRF read failed:', e); out = null; } }
      if(out){ rec.dekWrap = await wrapKey(await prfToKey(out), res.key); rec.prf = true; }
      else rec.prf = false;
    }
    // Data is encrypted with the data key, so a fingerprint is only useful if it can release that key
    if(!rec.prf){ showToast('This device\'s fingerprint can\'t unlock encrypted data — keep using your password', true); return; }
    localStorage.setItem(BIO_KEY, JSON.stringify(rec));
    updateLockHint();
    render();
    showToast('Biometric unlock on ✓');
  }catch(e){
    console.warn('Passkey creation failed:', e);
    showToast(e.name === 'NotAllowedError' ? 'Cancelled — biometric unlock not turned on' : 'Could not set up biometric unlock', true);
  }finally{ _bioInFlight = false; markActive(); }
}
function disableBio(){
  if(!confirm('Turn off biometric unlock on this device? You will unlock with your password. The passkey itself can be deleted from your phone\'s password manager (e.g. Google Password Manager → Portfolio Tracker).')) return;
  localStorage.removeItem(BIO_KEY);
  updateLockHint();
  render();
  showToast('Biometric unlock off');
}

// ═══════════════════════════════════════════════════════════════
// AUTO-LOCK — locks after N minutes without a tap or key press, counting time spent in other
// apps; or immediately on leaving the app. Stored per device. Default: 5 minutes.
// ═══════════════════════════════════════════════════════════════
const AUTOLOCK_OPTIONS = [['0','Never'],['leave','When I leave the app'],['1','After 1 minute'],['5','After 5 minutes'],['15','After 15 minutes'],['30','After 30 minutes']];
let _lastActive = Date.now();
// Leaving the page on purpose (fingerprint prompt, Android file picker for Import) must not trigger
// "lock when I leave the app"
let _externalUiUntil = 0;
function expectExternalUi(){ _externalUiUntil = Date.now() + 120000; }
function autoLockSetting(){ const v = localStorage.getItem(AUTOLOCK_KEY); return AUTOLOCK_OPTIONS.some(o => o[0] === v) ? v : '5'; }
function setAutoLock(v){ localStorage.setItem(AUTOLOCK_KEY, v); markActive(); showToast('Auto-lock: ' + AUTOLOCK_OPTIONS.find(o => o[0] === v)[1].toLowerCase()); }
function markActive(){ _lastActive = Date.now(); }
function autoLockDue(){
  const v = autoLockSetting(), mins = Number(v);
  return _unlocked && mins > 0 && Date.now() - _lastActive >= mins * 60000;
}
['pointerdown','keydown','wheel','touchstart'].forEach(ev => window.addEventListener(ev, markActive, {passive:true, capture:true}));
setInterval(() => { if(autoLockDue()) lockApp(); }, 15000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){
    if(_unlocked && autoLockSetting() === 'leave' && !_bioInFlight && Date.now() > _externalUiUntil) lockApp();
    return;
  }
  if(autoLockDue()) lockApp();
  else if(!_unlocked && loadBio()) setTimeout(doBioUnlock, 250);
});
function encryptionNoticeHTML(){
  if(HAS_SUBTLE&&dataIsEncrypted())return'<div class="enc-notice">🔒 Portfolio data, history, snapshots, the sync token and the Gist copy are encrypted (AES-256). The key is unlocked by your password or fingerprint. <b>If you forget your password, the data on this device can\'t be recovered</b> — restore from a JSON backup or the Gist.</div>';
  return'<div class="enc-notice warn">⚠ Your data is not encrypted on this page. Open the app from its secure (https) address — e.g. your GitHub Pages link — to turn encryption on automatically.</div>';
}
function securityExtrasHTML(){
  const bio = loadBio();
  let bioBody;
  if(!bioApiPresent()) bioBody = '<div style="color:var(--muted);font-size:12px;line-height:1.6">Not available here. Open the app from its secure web address (e.g. your GitHub Pages link), not as a file, on a device with fingerprint or face unlock.</div>';
  else if(_bioPlatform === null) bioBody = '<div style="color:var(--muted);font-size:12px">Checking this device…</div>';
  else if(bio) bioBody = '<div style="color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:12px">'
      + (bio.prf ? 'Your fingerprint or face unlocks the app, decrypts your data and your Gist sync. Your password still works at any time.' : 'Set up with an older version that can\'t decrypt your data. Turn it off and on again to upgrade — if this device can\'t, keep using your password.')
      + '</div>'
      + '<button class="btn btn-ghost" style="margin:0" onclick="disableBio()">Turn Off</button>';
  else if(!_bioPlatform) bioBody = '<div style="color:var(--muted);font-size:12px;line-height:1.6">This device has no fingerprint or face unlock set up for apps. Set one up in your phone\'s settings, then reopen this page.</div>';
  else bioBody = '<div style="color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:12px">Unlock with your phone\'s fingerprint or face instead of typing your password. Your password keeps working as a fallback. Needs a device that can release the encryption key biometrically — the app checks when you turn it on.</div>'
      + '<button class="btn btn-gold" style="margin:0" onclick="enableBio()">Turn On</button>';
  const sel = autoLockSetting();
  return '<div class="card" style="margin-bottom:10px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="color:var(--text);font-size:14px;font-weight:700">Fingerprint / Face Unlock</div>'
    + (bio ? '<span class="badge badge-green">On</span>' : '<span class="badge badge-dim">Off</span>') + '</div>'
    + bioBody + '</div>'
    + '<div class="card" style="margin-bottom:10px">'
    + '<div style="color:var(--text);font-size:14px;font-weight:700;margin-bottom:4px">Auto-Lock</div>'
    + '<div style="color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:12px">Locks the app when it\'s left idle (time in other apps counts) so nobody can open it on your unlocked phone. An unsaved form is closed when it locks.</div>'
    + '<select class="sel" style="width:100%" onchange="setAutoLock(this.value)">' + AUTOLOCK_OPTIONS.map(o => '<option value="' + o[0] + '"' + (o[0] === sel ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>'
    + '</div>';
}

function lockApp(){

async function changePassword(oldPwd, newPwd, confirmPwd){
  if(!newPwd || newPwd.length < 6){
    showToast('New password must be at least 6 characters', true); return;
  }
  if(newPwd === DEFAULT_PWD){
    showToast('Choose something other than the default password', true); return;
  }
  if(newPwd !== confirmPwd){
    showToast('New passwords do not match', true); return;
  }
  const res = await verifyPwd(oldPwd);
  if(!res.ok){
    showToast('Current password is incorrect', true); return;
  }
  if(HAS_SUBTLE){
    // Same data key, re-wrapped under the new password — the token and biometric unlock are unaffected
    await createPwdRecord(newPwd, res.key);
    _sessionKey = res.key;
    await unlockSyncToken();
    await rewrapSyncKeyForPassword(newPwd); // next push carries the new password's wrap
  } else {
    localStorage.setItem(PWD_KEY, hashPwd(newPwd));
  }
  closeModal();
  showToast('Password changed ✓');
  render();
}

  <div class="field"><label>New Password</label><input id="pwd-new" type="password" placeholder="Min. 6 characters"></div>
  <div class="field"><label>Confirm New Password</label><input id="pwd-confirm" type="password" placeholder="Repeat new password"></div>
  <button class="btn btn-gold" onclick="changePassword(document.getElementById('pwd-old').value,document.getElementById('pwd-new').value,document.getElementById('pwd-confirm').value)">Save New Password</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`);
}

}
updateLockHint();

// ─── PAYMENT DATA MIGRATION ───────────────────────────────────────────────────
// Converts old {amount, type} records to new {principal, profit} unified records
// Runs once on startup if old format detected
function migratePaymentsIfNeeded(){
  let migrated=false;
  state.portfolios.forEach(p=>{
    const pd=pData(p.id);
    if(!pd.payments||pd.payments.length===0) return;
    // Check if any payment uses old format (has 'type' field)
    if(!pd.payments.some(pay=>'type' in pay)) return;
    // Group by investmentId+date and merge
    const groups={};
    const order=[];
    pd.payments.forEach(pay=>{
      const key=pay.investmentId+'|'+pay.date;
      if(!groups[key]){
        groups[key]={investmentId:pay.investmentId,company:pay.company,
          principal:0,profit:0,date:pay.date,notes:''};
        order.push(key);
      }
      const amt=Number(pay.amount||0);
      if(pay.type==='Principal') groups[key].principal=+(groups[key].principal+amt).toFixed(2);
      else groups[key].profit=+(groups[key].profit+amt).toFixed(2);
      const note=(pay.notes||'').replace('(profit)','').replace(/^profit$/,'').trim();
      if(note&&!groups[key].notes) groups[key].notes=note;
    });
    pd.payments=order.map((key,i)=>({id:i+1,...groups[key]}));
    pd.nextPayId=pd.payments.length+1;
    migrated=true;
  });
  if(migrated){saveState({label:'Converted payments to the principal/profit format',silent:true});console.log('Payment data migrated to unified format');}
}
