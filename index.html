<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Investment Portfolio Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#0D1117;--surface:#161B22;--card:#1C2333;--border:#30363D;--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:#8B6E2E;--gold-bg:#1A1608;--text:#E6EDF3;--muted:#8B949E;--dim:#484F58;--green:#3FB950;--green-bg:#0D1F11;--red:#F85149;--red-bg:#2D1215;--blue:#58A6FF;--blue-bg:#0D1F33;--purple:#BC8CFF;--purple-bg:#1A0D33;--orange:#D29922;--orange-bg:#2B1D06}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:14px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
.port-bar{display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.port-bar::-webkit-scrollbar{display:none}
.port-btn{flex-shrink:0;background:none;border:none;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;padding:10px 12px;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;font-family:inherit}
.port-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 80px}
.view::-webkit-scrollbar{display:none}
.page-header{padding:20px 0 14px}
.page-eyebrow{color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.page-title{color:var(--text);font-size:22px;font-weight:800;letter-spacing:-0.5px}
.page-sub{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}
.card-hero{background:linear-gradient(135deg,#1C2333 0%,#0D1117 100%);border:1px solid rgba(201,168,76,0.2);border-radius:16px;padding:20px 18px;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;border:1px solid}
.badge-green{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.badge-dim{background:var(--card);color:var(--muted);border-color:var(--border)}
.badge-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.badge-gold{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-dim)}
.badge-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid;transition:all 0.2s}
.chip-active{background:var(--gold);color:#000;border-color:var(--gold)}
.chip-inactive{background:var(--card);color:var(--muted);border-color:var(--border)}
.sel-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:12px;font-family:inherit;-webkit-appearance:none;cursor:pointer;flex:1;min-width:120px}
.sel:focus{outline:none;border-color:var(--gold)}
.mini-bar-bg{background:var(--border);border-radius:4px;height:4px;width:100%;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.fab{position:fixed;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#000;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(201,168,76,0.4);z-index:100;transition:transform 0.15s}
.fab:active{transform:scale(0.93)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;padding:20px 20px env(safe-area-inset-bottom,20px);max-height:90vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.field select option{background:var(--card)}
.btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.8}
.btn-gold{background:var(--gold);color:#000}
.btn-ghost{background:var(--card);color:var(--muted);margin-top:8px;border:1px solid var(--border)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red);margin-top:8px}
.back-btn{background:none;border:none;color:var(--gold);font-size:14px;cursor:pointer;padding:20px 0 8px;display:flex;align-items:center;gap:6px;font-family:inherit}
.toggle{display:flex;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:18px}
.toggle-btn{flex:1;border:none;border-radius:8px;padding:8px 0;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:inherit}
.toggle-active{background:var(--gold);color:#000}
.toggle-inactive{background:transparent;color:var(--muted)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.has-action{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px}
.toast-undo{background:rgba(0,0,0,0.18);border:none;border-radius:14px;color:inherit;font:inherit;font-weight:800;padding:5px 12px;cursor:pointer}
.empty{text-align:center;padding:48px 20px;color:var(--dim);font-size:14px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.section-label{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;margin-top:4px}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.chart-title{color:var(--text);font-size:13px;font-weight:700;margin-bottom:14px}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi-row .stat-card{min-width:0}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 12px}
.dash-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dash-stat-l{color:var(--muted);font-size:11px}
.dash-stat-v{color:var(--text);font-size:14px;font-weight:700;margin-top:2px}
.dash-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.dash-action{display:flex;align-items:center;padding:9px 0;border-top:1px solid var(--border);cursor:pointer}
.dash-log-btn{background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:8px;padding:6px 9px;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:10px;font-family:inherit}
canvas{max-width:100%}
.install-banner{background:linear-gradient(135deg,var(--gold-bg),#0D1117);border:1px solid var(--gold-dim);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.install-btn{background:var(--gold);color:#000;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.install-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:0 0 0 8px}

.lock-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px}
.lock-logo{font-size:56px;margin-bottom:16px}
.lock-title{color:var(--gold-light);font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px;text-align:center}
.lock-sub{color:var(--muted);font-size:13px;margin-bottom:48px;text-align:center}
.lock-input-wrap{width:100%;max-width:320px;position:relative;margin-bottom:14px}
.lock-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 48px 16px 18px;color:var(--text);font-size:18px;font-family:inherit;letter-spacing:2px;text-align:center;-webkit-appearance:none}
.lock-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.15)}
.lock-input.shake{animation:shake 0.4s ease}
.lock-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
.lock-btn{width:100%;max-width:320px;padding:16px;background:var(--gold);color:#000;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity 0.2s}
.lock-btn:active{opacity:0.85}
.lock-btn.secondary{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.lock-error{color:var(--red);font-size:13px;font-weight:600;margin-top:10px;min-height:20px;text-align:center}
.lock-bio-btn{width:100%;max-width:320px;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;background:var(--gold);color:#000;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:6px}
.lock-bio-btn:active{opacity:0.85}
.lock-or{color:var(--dim);font-size:12px;margin:12px 0 14px;text-align:center}
.enc-notice{background:var(--green-bg);border:1px solid #2EA04366;border-radius:10px;padding:10px 12px;color:#56D364;font-size:12px;line-height:1.6;margin-bottom:12px}
.enc-notice b{color:#7EE787}
.enc-notice.warn{background:var(--gold-bg);border-color:var(--gold-dim);color:var(--gold)}
.lock-hint{color:var(--dim);font-size:11px;margin-top:32px;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.top-nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.top-nav::-webkit-scrollbar{display:none}
.top-nav-btn{flex:1;min-width:60px;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-family:inherit;transition:all 0.2s;white-space:nowrap}
.top-nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.top-nav-btn:not(.active){color:var(--dim)}
.top-nav-icon{font-size:18px}
.top-nav-label{font-size:9px;font-weight:700;letter-spacing:0.3px}

/* ── Responsive layout ─────────────────────────────────────────────
   Phone: portfolio bar, then tabs, then the page (stacked).
   Fold ≥720px: side rail + wider page, two-column grids, deals list beside the selected deal.
   Desktop ≥1100px: labelled sidebar, deals as a table, forms slide in from the right. */
.main{display:contents}
.port-bar{order:0}.top-nav{order:1}.view{order:2}
.card-sel{border-color:var(--gold)}
.wide-grid>*,.card-grid>*{min-width:0}
.deal-table{width:100%;border-collapse:collapse;font-size:13px}
.deal-table th{color:var(--muted);font-size:11px;font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;position:sticky;top:0;background:var(--bg)}
.deal-table td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.deal-table .num{text-align:right;white-space:nowrap}
.deal-table tbody tr{cursor:pointer}
.deal-table tbody tr:hover{background:var(--surface)}
.deal-table tbody tr.sel{background:var(--card);box-shadow:inset 3px 0 0 var(--gold)}
@media (min-width:720px){
  html,body{position:static}
  #app{flex-direction:row;max-width:none}
  .main{display:flex;flex-direction:column;flex:1;min-width:0;height:100%}
  .top-nav{order:-1;flex-direction:column;width:78px;flex-shrink:0;border-bottom:none;border-right:1px solid var(--border);overflow-y:auto;padding:10px 0;gap:2px}
  .top-nav-btn{flex:none;min-width:0;border-bottom:none;border-left:3px solid transparent;padding:10px 4px;gap:3px}
  .top-nav-btn.active{border-left-color:var(--gold);background:var(--gold-bg)}
  .top-nav-label{font-size:10px}
  .port-bar{padding:0 20px}
  .view{padding:0 24px 40px}
  .view[data-tab="setup"],.view[data-tab="capital"]{padding-left:max(24px,calc((100% - 760px)/2));padding-right:max(24px,calc((100% - 760px)/2))}
  .view[data-tab="investments"]{padding:0;overflow:hidden}
  .kpi-row{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dash-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .dash-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .wide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start}
  .chart-wrap canvas{max-height:300px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0 12px;align-items:start}
  .split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);height:100%}
  .split-list{overflow-y:auto;padding:0 16px 80px 24px;border-right:1px solid var(--border)}
  .split-detail{overflow-y:auto;padding:4px 24px 80px}
  .split-detail .back-btn{display:none}
  .modal-overlay{align-items:center;justify-content:center}
  .modal{border-radius:20px;max-width:560px;max-height:86vh;padding:24px}
  .modal-handle{display:none}
  .fab{right:28px;bottom:28px}
  .toast{top:20px}
}
@media (min-width:1100px){
  .top-nav{width:196px;padding:14px 10px;gap:4px}
  .top-nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-left:none;border-radius:10px}
  .top-nav-btn.active{background:var(--gold-bg)}
  .top-nav-icon{font-size:16px;width:20px;text-align:center}
  .top-nav-label{font-size:13px;font-weight:600;letter-spacing:0}
  .view{padding:0 max(32px,calc((100% - 1320px)/2)) 40px}
  .split-desk{grid-template-columns:minmax(0,1.5fr) minmax(400px,1fr)}
  .wide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-overlay{justify-content:flex-end;align-items:stretch}
  .modal{margin:0;width:460px;max-width:460px;height:100%;max-height:none;border-radius:0;border-left:1px solid var(--border)}
}
</style>

// Real same-origin service worker file (not a Blob URL — Blob-URL registration is unreliable on

// Service Workers require http(s), so this only activates once hosted (e.g. GitHub Pages).
if('serviceWorker' in navigator){

}

</head>

// opts.label — describe a whole-state replacement (import, reset) instead of diffing it
// opts.snapshot — take a restorable snapshot of the previous data before saving
// opts.silent — no Undo toast (the caller shows its own message)
function saveState(opts){
  opts=opts||{};
  const prevJSON=_lastSavedJSON;
  const nextJSON=JSON.stringify(state);
  if(prevJSON===nextJSON)return;
  if(opts.snapshot)takeSnapshot(opts.label?'Before: '+opts.label:'Before a bulk change',prevJSON);
  else maybeDailySnapshot(prevJSON);
  secureWrite(STORE_KEY,nextJSON);
  _lastSavedJSON=nextJSON;
  syncConfig.localChangeSeq=(syncConfig.localChangeSeq||0)+1;
  saveSyncConfig(syncConfig);
  let lines=[];
  try{lines=opts.label?[opts.label]:describeChanges(JSON.parse(prevJSON),state);}catch(e){}
  if(!lines.length)lines=['Data updated'];
  recordHistory(lines);
  _undoStack.push({json:prevJSON,summary:lines[0]});
  if(_undoStack.length>UNDO_DEPTH)_undoStack.shift();
  if(!opts.silent)_pendingUndoToast=lines[0];
}

// ═══════════════════════════════════════════════════════════════
// CHANGE HISTORY, UNDO & SNAPSHOTS
// Every save is diffed against the previous saved copy to produce a human-readable history line,
// and the previous copy is kept in an in-memory undo stack. Snapshots (full copies, kept on this
// device) are taken automatically once a day and before any bulk replacement (import, reset,
// Gist pull, restoring another snapshot), so a bad change can always be rolled back.
// History and snapshots live in their own keys (encrypted like the data), so JSON exports and
// Gist pushes stay unchanged.
// ═══════════════════════════════════════════════════════════════
const HISTORY_KEY='ipt_history',SNAPSHOT_KEY='ipt_snapshots';
const HISTORY_MAX=300,SNAPSHOT_MAX=10,UNDO_DEPTH=20;
let _lastSavedJSON=null; // set by loadSecureData()
let _undoStack=[];
let _pendingUndoToast=null;

// ENCRYPTION AT REST — the app data (saf_v7), history and snapshots are stored as
// {__ipt_enc:1, iv, ct}: AES-256-GCM under the data key (see PASSWORD / LOCK ENGINE), which only
// exists in memory while unlocked. Nothing is decrypted before unlock, and lockApp() drops the
// decrypted copies from memory. Without WebCrypto (plain-http hosting) storage stays as plain JSON.
// Writes are asynchronous (encryption), so they're chained to land in the order they were made.
let _historyCache=[],_snapshotsCache=[];
let _writeChain=Promise.resolve();
function isEncBlob(v){return!!(v&&typeof v==='object'&&v.__ipt_enc===1&&v.iv&&v.ct);}
function storedIsEncrypted(k){try{return isEncBlob(JSON.parse(localStorage.getItem(k)));}catch(e){return false;}}
function secureWrite(k,value){
  const text=typeof value==='string'?value:JSON.stringify(value);
  const key=_sessionKey;
  const job=_writeChain.then(async()=>{
    try{
      const out=key&&HAS_SUBTLE?JSON.stringify(Object.assign({__ipt_enc:1},await encryptSecret(text,key))):text;
      localStorage.setItem(k,out);return true;
    }catch(e){console.warn('Could not save '+k,e);return false;}
  });
  _writeChain=job.then(()=>{},()=>{});
  return job;
}
async function readSecure(k,fallback){
  const raw=localStorage.getItem(k);
  if(raw==null)return fallback;
  const v=JSON.parse(raw);
  if(!isEncBlob(v))return v;
  if(!_sessionKey)throw new Error('Data is encrypted and the app is locked');
  return JSON.parse(await decryptSecret(v));
}
// Called by finishUnlock(): decrypts (or, first time, encrypts) everything and fills the caches
async function loadSecureData(){
  const raw=localStorage.getItem(STORE_KEY);
  let json=null;
  if(raw!=null){
    const v=JSON.parse(raw);
    json=isEncBlob(v)?await decryptSecret(v):raw;
  }
  adoptState(json||JSON.stringify(defaultState()));
  _lastSavedJSON=JSON.stringify(state);
  _historyCache=await readSecure(HISTORY_KEY,[]).catch(()=>[]);
  _snapshotsCache=await readSecure(SNAPSHOT_KEY,[]).catch(()=>[]);
  _undoStack=[];
  // One-time migration: anything still stored as plain text is rewritten encrypted
  if(_sessionKey){
    if(!storedIsEncrypted(STORE_KEY))await secureWrite(STORE_KEY,_lastSavedJSON);
    if(localStorage.getItem(HISTORY_KEY)!=null&&!storedIsEncrypted(HISTORY_KEY))await secureWrite(HISTORY_KEY,_historyCache);
    if(localStorage.getItem(SNAPSHOT_KEY)!=null&&!storedIsEncrypted(SNAPSHOT_KEY))await secureWrite(SNAPSHOT_KEY,_snapshotsCache);
  }
}
function wipeSecureData(){
  state=null;_lastSavedJSON=null;_historyCache=[];_snapshotsCache=[];_undoStack=[];_pendingUndoToast=null;
}
function dataIsEncrypted(){return storedIsEncrypted(STORE_KEY);}
function loadHistory(){return _historyCache;}
function recordHistory(lines){
  _historyCache.unshift({ts:new Date().toISOString(),lines});
  _historyCache=_historyCache.slice(0,HISTORY_MAX);
  secureWrite(HISTORY_KEY,_historyCache);
}
function loadSnapshots(){return _snapshotsCache;}
function takeSnapshot(reason,json){
  _snapshotsCache.unshift({id:Date.now().toString(36),ts:new Date().toISOString(),reason,data:json||JSON.stringify(state)});
  _snapshotsCache=_snapshotsCache.slice(0,SNAPSHOT_MAX);
  persistSnapshots();
}
// Oldest snapshots drop off first; if storage is full, keep trimming until it fits
async function persistSnapshots(){
  while(_snapshotsCache.length&&!(await secureWrite(SNAPSHOT_KEY,_snapshotsCache)))_snapshotsCache=_snapshotsCache.slice(0,-1);
}
function maybeDailySnapshot(prevJSON){
  const today=new Date().toISOString().slice(0,10);
  if(!loadSnapshots().some(s=>s.ts.slice(0,10)===today))takeSnapshot('Start of day',prevJSON);
}

// Turns the difference between two saved states into short history lines
const FIELD_LABELS={company:'company',deployed:'capital',roi:'rate',duration:'term',fundSource:'fund source',date:'date',status:'status',notes:'notes',commission:'commission',commissionType:'commission type',commissionValue:'commission %',grossCapital:'gross capital',principal:'principal',profit:'profit',amount:'amount',type:'type',name:'name',rate:'rate',termMonths:'term',drawDate:'draw date',color:'colour',owner:'owner',invCode:'code'};
function fmtVal(v){if(v==null||v==='')return'—';if(typeof v==='number')return Number(v).toLocaleString('en',{maximumFractionDigits:3});return String(v);}
function fieldChanges(a,b){
  const keys=new Set([...Object.keys(a),...Object.keys(b)]);
  const out=[];
  keys.forEach(k=>{
    if(k==='id'||k==='investmentId'||k==='loanId')return;
    if(JSON.stringify(a[k])!==JSON.stringify(b[k])&&!(a[k]==null&&b[k]==null))out.push((FIELD_LABELS[k]||k)+' '+fmtVal(a[k])+' → '+fmtVal(b[k]));
  });
  return out;
}
function diffList(before,after,name,label,lines){
  const bm=new Map((before||[]).map(x=>[String(x.id),x])),am=new Map((after||[]).map(x=>[String(x.id),x]));
  am.forEach((x,id)=>{
    const old=bm.get(id);
    if(!old)lines.push('Added '+name+': '+label(x));
    else{const ch=fieldChanges(old,x);if(ch.length)lines.push('Edited '+name+' '+label(x)+': '+ch.join(', '));}
  });
  bm.forEach((x,id)=>{if(!am.has(id))lines.push('Deleted '+name+': '+label(x));});
}
function describeChanges(prev,next){
  const lines=[];
  diffList(prev.portfolios,next.portfolios,'portfolio',p=>p.name,lines);
  const pids=new Set([...(prev.portfolios||[]).map(p=>p.id),...(next.portfolios||[]).map(p=>p.id)]);
  pids.forEach(pid=>{
    const a=prev[pid]||{},b=next[pid]||{};
    diffList(a.investments,b.investments,'deal',i=>i.company,lines);
    diffList(a.payments,b.payments,'payment',p=>fmtVal(Number(p.principal||0)+Number(p.profit||0))+' · '+p.company+' · '+fmtDate(p.date),lines);
  });
  diffList(prev.equityFlows,next.equityFlows,'equity movement',f=>f.type+' '+fmtVal(Number(f.amount))+' · '+fmtDate(f.date),lines);
  diffList(prev.odFlows,next.odFlows,'OD movement',f=>f.type+' '+fmtVal(Number(f.amount))+' · '+fmtDate(f.date),lines);
  diffList(prev.loans,next.loans,'loan',l=>l.name,lines);
  diffList(prev.loanPayments,next.loanPayments,'loan payment',p=>fmtVal(Number(p.amount))+' · '+fmtDate(p.date),lines);
  [['odRate','OD rate'],['targetRoi','target ROI'],['capitalRowLimit','rows shown']].forEach(([k,l])=>{
    if(prev[k]!==next[k])lines.push('Changed '+l+': '+fmtVal(prev[k])+' → '+fmtVal(next[k]));
  });
  return lines;
}

// Replaces in-memory state from a JSON string and fills in fields older backups may lack
function adoptState(json){
  const parsed=JSON.parse(json);
  if(parsed.odRate===undefined)parsed.odRate=4.75;
  if(parsed.targetRoi===undefined)parsed.targetRoi=15;
  if(parsed.capitalRowLimit===undefined)parsed.capitalRowLimit=7;
  ['loans','loanPayments','equityFlows','odFlows'].forEach(k=>{if(!parsed[k])parsed[k]=[];});
  state=parsed;
  if(!state.portfolios.some(p=>p.id===currentPortfolio)&&currentPortfolio!=='all')currentPortfolio=state.portfolios[0]?.id||'all';
  if(detailId!=null&&!(pData(detailPortfolio).investments||[]).some(i=>i.id===detailId)){detailId=null;if(currentTab==='detail')currentTab='investments';}
}
function undoLast(){
  const u=_undoStack.pop();
  if(!u){showToast('Nothing to undo',true);return;}
  const currentJSON=JSON.stringify(state);
  adoptState(u.json);
  secureWrite(STORE_KEY,u.json);
  _lastSavedJSON=u.json;
  syncConfig.localChangeSeq=(syncConfig.localChangeSeq||0)+1;
  saveSyncConfig(syncConfig);
  let lines=[];
  try{lines=describeChanges(JSON.parse(currentJSON),state);}catch(e){}
  recordHistory(['Undid: '+u.summary].concat(lines.slice(0,5)));
  _pendingUndoToast=null;
  closeModal();render();showToast('Undone: '+u.summary);
}
function restoreSnapshot(id){
  const s=loadSnapshots().find(x=>x.id===id);
  if(!s)return;
  if(!confirm('Restore the snapshot from '+fmtDate(s.ts)+' '+new Date(s.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'? Your current data is snapshotted first, so this can be reversed.'))return;
  try{adoptState(s.data);}catch(e){showToast('That snapshot is unreadable',true);return;}
  saveState({label:'Restored snapshot from '+fmtDate(s.ts)+' ('+s.reason+')',snapshot:true,silent:true});
  render();showToast('Snapshot restored ✓');
}
function snapshotNow(){takeSnapshot('Manual snapshot');render();showToast('Snapshot saved ✓');}
function clearHistory(){
  if(!confirm('Clear the change history on this device? Your data and snapshots are not affected.'))return;
  _historyCache=[];secureWrite(HISTORY_KEY,[]);render();showToast('History cleared');
}
function fmtStamp(ts){const d=new Date(ts);return fmtDate(d)+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function historySectionHTML(){
  const h=loadHistory(),snaps=loadSnapshots();

    +'<button class="btn btn-ghost" style="margin:0" onclick="undoLast()">↶ Undo Last Change</button></div>'

    +'<div style="color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:6px">Full copies kept on this device — one per day automatically, and before every import, reset, Gist pull or restore. The last '+SNAPSHOT_MAX+' are kept.</div>'
    +(snapRows.length?snapRows.join(''):'<div style="color:var(--muted);font-size:12px;padding:8px 0">No snapshots yet — one is taken with your first change today.</div>')

function escHTML(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ═══════════════════════════════════════════════════════════════
// GITHUB GIST SYNC — manual, whole-state push/pull (no auto-merge).
// Credentials and sync bookkeeping are kept in a SEPARATE localStorage key from the app's own
// state, so (a) "Export to JSON" never leaks the token, and (b) the Gist payload itself never
// contains the token used to access it. The token is stored AES-GCM-encrypted under a key derived
// from the app password (see PASSWORD / LOCK ENGINE). The Gist you connect to should be a SECRET Gist
// (gist.github.com → Create secret gist) — "secret" means unlisted, not access-controlled: treat
// the Gist ID + URL as sensitive, since anyone with the exact link could read your data.
// ═══════════════════════════════════════════════════════════════
const SYNC_CONFIG_KEY='ipt_sync_config';
const GITHUB_API='https://api.github.com';

function loadSyncConfig(){
  try{
    const raw=localStorage.getItem(SYNC_CONFIG_KEY);
    const cfg=raw?JSON.parse(raw):null;
    if(cfg&&typeof cfg==='object'){
      return{
        gistId:typeof cfg.gistId==='string'?cfg.gistId:'',
        token:typeof cfg.token==='string'?cfg.token:'', // legacy plaintext; encrypted on next unlock
        tokenEnc:cfg.tokenEnc&&cfg.tokenEnc.iv&&cfg.tokenEnc.ct?cfg.tokenEnc:null,
        syncKey:cfg.syncKey&&cfg.syncKey.id&&cfg.syncKey.wrap&&cfg.syncKey.pwd?cfg.syncKey:null,
        filename:typeof cfg.filename==='string'&&cfg.filename?cfg.filename:'investment-portfolio-tracker-state.json',
        lastSyncedAt:typeof cfg.lastSyncedAt==='string'?cfg.lastSyncedAt:null,
        lastSyncedRemoteUpdatedAt:typeof cfg.lastSyncedRemoteUpdatedAt==='string'?cfg.lastSyncedRemoteUpdatedAt:null,
        localChangeSeq:Number.isFinite(cfg.localChangeSeq)?cfg.localChangeSeq:0,
        syncedSeq:Number.isFinite(cfg.syncedSeq)?cfg.syncedSeq:0,
      };
    }
  }catch(e){}
  return{gistId:'',token:'',tokenEnc:null,syncKey:null,filename:'investment-portfolio-tracker-state.json',lastSyncedAt:null,lastSyncedRemoteUpdatedAt:null,localChangeSeq:0,syncedSeq:0};
}
// The decrypted token only ever lives in memory. A plaintext token is written back only while no
// encrypted copy exists yet (legacy config awaiting migration, or no WebCrypto), so it's never lost.
function saveSyncConfig(cfg){
  try{
    const out=Object.assign({},cfg);
    if(out.tokenEnc)delete out.token;
    localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(out));
  }catch(e){}
}
let syncConfig=loadSyncConfig();

// Connected = a Gist ID plus a token, even if the token is still encrypted (see ensureSessionKey)
function isSyncConnected(){return!!(syncConfig.gistId&&(syncConfig.token||syncConfig.tokenEnc));}
function isSyncDirty(){
  if(!isSyncConnected())return false;
  if(!syncConfig.lastSyncedAt)return true;
  return syncConfig.localChangeSeq>syncConfig.syncedSeq;
}
function authHeaders(token){return{'Authorization':'token '+token,'Accept':'application/vnd.github+json'};}
function syncApiErrorMessage(status){
  if(status===401)return'Your access token was rejected — it may be invalid, expired, or missing the "gist" scope.';
  if(status===404)return'Gist not found — check the Gist ID.';
  if(status===403)return'GitHub blocked the request (rate limit or token scope) — try again shortly.';
  return'GitHub returned an error (status '+status+').';
}
async function fetchGistFile(gistId,token,preferredFilename){
  const res=await fetch(GITHUB_API+'/gists/'+encodeURIComponent(gistId),{headers:authHeaders(token)});
  if(!res.ok)throw new Error(syncApiErrorMessage(res.status));
  const gist=await res.json();
  const files=gist.files||{};
  let filename=preferredFilename,file=files[filename];
  if(!file){
    const names=Object.keys(files);
    if(names.length===1){filename=names[0];file=files[filename];}
  }
  if(!file)throw new Error('No file named "'+preferredFilename+'" was found in that Gist.');
  let content=file.content||'';
  if(file.truncated&&file.raw_url){
    const rawRes=await fetch(file.raw_url);
    if(!rawRes.ok)throw new Error('Could not fetch the full Gist content.');
    content=await rawRes.text();
  }
  return{content,updatedAt:gist.updated_at,filename};
}
async function pushToGist(gistId,token,filename,jsonText){
  const res=await fetch(GITHUB_API+'/gists/'+encodeURIComponent(gistId),{
    method:'PATCH',
    headers:Object.assign({'Content-Type':'application/json'},authHeaders(token)),
    body:JSON.stringify({files:{[filename]:{content:jsonText}}})
  });
  if(!res.ok)throw new Error(syncApiErrorMessage(res.status));
  const gist=await res.json();
  return{updatedAt:gist.updated_at};
}
async function connectSync(){
  const gistId=document.getElementById('sync-gist-id').value.trim();
  const token=document.getElementById('sync-token').value.trim();
  if(!gistId||!token){showToast('Enter both the Gist ID and your access token',true);return;}
  if(!(await ensureSessionKey('Your password is needed to store the access token encrypted.')))return;
  const tokenEnc=_sessionKey?await encryptSecret(token):null;
  syncConfig={gistId,token,tokenEnc,syncKey:syncConfig.syncKey||null,filename:syncConfig.filename||'investment-portfolio-tracker-state.json',lastSyncedAt:null,lastSyncedRemoteUpdatedAt:null,localChangeSeq:syncConfig.localChangeSeq||1,syncedSeq:0};
  saveSyncConfig(syncConfig);
  render();
  showToast('Connected — push or pull to sync ✓');
}
function disconnectSync(){
  if(!confirm('Disconnect from the Gist? Your local data is unaffected — this only forgets the connection on this device.'))return;
  syncConfig={gistId:'',token:'',tokenEnc:null,syncKey:syncConfig.syncKey||null,filename:syncConfig.filename,lastSyncedAt:null,lastSyncedRemoteUpdatedAt:null,localChangeSeq:syncConfig.localChangeSeq,syncedSeq:0};
  saveSyncConfig(syncConfig);
  render();
  showToast('Disconnected');
}
// GIST ENCRYPTION — the Gist holds {format:'ipt-encrypted-v1', keyId, kdf, keyWrap, data}.
// data is the app state encrypted with a random "sync key". keyWrap is that sync key encrypted
// with a key derived from the app password (PBKDF2, salt in kdf), so any device that knows the
// password can open it. Each device also keeps the sync key wrapped by its own data key
// (syncConfig.syncKey), so later pushes/pulls need no password — only the first pull on a new
// device, or after another device started a fresh sync key, asks for it.
const GIST_FORMAT='ipt-encrypted-v1';
async function localSyncKey(){
  const sk=syncConfig.syncKey;
  if(!sk||!_sessionKey)return null;
  try{return await unwrapKey(_sessionKey,sk.wrap);}catch(e){return null;}
}
async function rememberSyncKey(id,key,pwdBlock){
  syncConfig.syncKey={id,wrap:await wrapKey(_sessionKey,key),pwd:pwdBlock};
  saveSyncConfig(syncConfig);
}
async function ensureSyncKeyForPush(){
  const existing=await localSyncKey();
  if(existing)return{key:existing,rec:syncConfig.syncKey};
  const pwd=await askPassword('Encrypt your Gist copy','Enter your app password. Other devices will need this password the first time they pull.');
  if(pwd==null)return null;
  const v=await verifyPwd(pwd);
  if(!v.ok){showToast('Incorrect password',true);return null;}
  if(v.key)_sessionKey=v.key;
  const key=await newDataKey(),salt=crypto.getRandomValues(new Uint8Array(16));
  const d=await derivePwd(pwd,salt,PBKDF2_ITER);
  await rememberSyncKey(b64url(crypto.getRandomValues(new Uint8Array(9))),key,{salt:b64(salt),iter:PBKDF2_ITER,wrap:await wrapKey(d.kek,key)});
  return{key,rec:syncConfig.syncKey};
}
async function encryptForGist(jsonText){
  const sk=await ensureSyncKeyForPush();
  if(!sk)return null;
  return JSON.stringify({format:GIST_FORMAT,app:'Investment Portfolio Tracker',note:'Encrypted backup — open it in the app with your app password.',
    keyId:sk.rec.id,kdf:{name:'PBKDF2-SHA256',salt:sk.rec.pwd.salt,iter:sk.rec.pwd.iter},keyWrap:sk.rec.pwd.wrap,data:await encryptSecret(jsonText,sk.key)},null,2);
}
// Returns the decrypted state JSON, or null if the user cancelled / the password was wrong
async function decryptFromGist(p){
  let key=null;
  if(syncConfig.syncKey&&syncConfig.syncKey.id===p.keyId)key=await localSyncKey();
  if(!key){
    const pwd=await askPassword('Open the encrypted Gist copy','Enter the app password used on the device that pushed this data.');
    if(pwd==null)return null;
    try{
      const d=await derivePwd(pwd,unb64(p.kdf.salt),p.kdf.iter||PBKDF2_ITER);
      key=await unwrapKey(d.kek,p.keyWrap);
    }catch(e){showToast('That password doesn\'t open this Gist copy',true);return null;}
    if(_sessionKey)await rememberSyncKey(p.keyId,key,{salt:p.kdf.salt,iter:p.kdf.iter,wrap:p.keyWrap});
  }
  return decryptSecret(p.data,key);
}
// After a password change, re-wrap the portable copy of the sync key under the new password
async function rewrapSyncKeyForPassword(newPwd){
  const key=await localSyncKey();
  if(!key)return;
  const salt=crypto.getRandomValues(new Uint8Array(16)),d=await derivePwd(newPwd,salt,PBKDF2_ITER);
  syncConfig.syncKey.pwd={salt:b64(salt),iter:PBKDF2_ITER,wrap:await wrapKey(d.kek,key)};
  saveSyncConfig(syncConfig);
}

// The token may still be encrypted after a fingerprint unlock on a device without PRF support
async function syncTokenReady(){
  if(syncConfig.token)return true;
  if(!(await ensureSessionKey('Your password is needed once this session to unlock the Gist access token.')))return false;
  if(!syncConfig.token){showToast('Access token unavailable — reconnect in Setup',true);return false;}
  return true;
}
async function syncPushNow(){
  const cfg=syncConfig;
  if(!isSyncConnected()){showToast('Connect to a Gist first',true);return;}
  if(!HAS_SUBTLE){showToast('Encrypted sync needs the app\'s secure (https) address',true);return;}
  if(!(await syncTokenReady()))return;
  const seqAtPushTime=cfg.localChangeSeq;
  const jsonText=await encryptForGist(JSON.stringify(state));
  if(!jsonText)return;
  const btn=document.getElementById('sync-push-btn');
  if(btn){btn.disabled=true;btn.textContent='Pushing…';}
  try{
    const result=await pushToGist(cfg.gistId,cfg.token,cfg.filename,jsonText);
    cfg.syncedSeq=seqAtPushTime;
    cfg.lastSyncedAt=new Date().toISOString();
    cfg.lastSyncedRemoteUpdatedAt=result.updatedAt;
    saveSyncConfig(cfg);
    render();
    showToast('Pushed to Gist ✓');
  }catch(e){
    showToast(e.message||'Push failed',true);
  }
}
async function syncPullNow(){
  const cfg=syncConfig;
  if(!isSyncConnected()){showToast('Connect to a Gist first',true);return;}
  if(!(await syncTokenReady()))return;
  if(!confirm('This replaces ALL data on this device with what\'s saved in the Gist. Anything entered here since your last sync is replaced too — a snapshot of it is kept in Setup → Snapshots. Continue?'))return;
  const btn=document.getElementById('sync-pull-btn');
  if(btn){btn.disabled=true;btn.textContent='Pulling…';}
  try{
    const remote=await fetchGistFile(cfg.gistId,cfg.token,cfg.filename);
    cfg.filename=remote.filename;
    if(!remote.content||!remote.content.trim()){showToast('Gist is empty — push from here first',true);render();return;}
    let content=remote.content,parsed=JSON.parse(content);
    if(parsed&&parsed.format===GIST_FORMAT){            // encrypted copy (plain copies from older versions still load)
      content=await decryptFromGist(parsed);
      if(content==null){render();return;}
      parsed=JSON.parse(content);
    }
    if(!parsed||!parsed.portfolios){showToast('Gist content is not a valid backup',true);render();return;}
    const prevJSON=_lastSavedJSON;
    adoptState(content);
    const pulledJSON=JSON.stringify(state);
    if(pulledJSON!==prevJSON){
      takeSnapshot('Before Gist pull',prevJSON);
      _undoStack.push({json:prevJSON,summary:'Gist pull'});
      let lines=[];try{lines=describeChanges(JSON.parse(prevJSON),state).slice(0,20);}catch(e){}
      recordHistory(['Pulled data from the Gist'].concat(lines));
    }
    secureWrite(STORE_KEY,pulledJSON);
    _lastSavedJSON=pulledJSON;
    cfg.syncedSeq=cfg.localChangeSeq; // pulling also counts as "caught up"
    cfg.lastSyncedAt=new Date().toISOString();
    cfg.lastSyncedRemoteUpdatedAt=remote.updatedAt;
    saveSyncConfig(cfg);
    currentPortfolio=state.portfolios[0]?.id||'wadiaa';
    currentTab='dashboard';
    render();
    showToast('Pulled from Gist ✓');
  }catch(e){
    showToast(e.message||'Pull failed',true);
    render();
  }
}
function syncStatusHTML(){
  if(!isSyncConnected())return'<div style="color:var(--muted);font-size:12px">Not connected</div>';
  const dirty=isSyncDirty();
  const last=syncConfig.lastSyncedAt?fmtDate(syncConfig.lastSyncedAt)+' '+new Date(syncConfig.lastSyncedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'Never';
  return'<div style="color:'+(dirty?'var(--gold)':'var(--green)')+';font-size:12px;font-weight:600">'+(dirty?'⚠ Unsynced changes on this device':'✓ Synced with the Gist')+'</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-top:2px">Last synced: '+last+'</div>';
}
function syncSectionHTML(){
  const connected=isSyncConnected();
  return'<div class="section-label">GitHub Gist Sync</div>'
    +'<div class="card" style="margin-bottom:10px">'
    +'<div style="color:var(--text);font-size:14px;font-weight:700;margin-bottom:4px">Cross-Device Backup (Secret Gist)</div>'
    +'<div style="color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:14px">Push saves an <b style="color:var(--green)">encrypted</b> copy of your data to a GitHub Gist you control — GitHub only ever sees scrambled data. Pull loads it back, e.g. on another device, which asks once for the app password of the device that pushed it. '
    +'<b style="color:var(--gold)">This does not replace the JSON backup below</b> — keep making those too. '
    +'Keep the Gist ID and your token private all the same.</div>'
    +(connected?(
      '<div style="margin-bottom:14px">'+syncStatusHTML()+'</div>'
      +'<div style="display:flex;gap:8px;margin-bottom:8px">'
      +'<button class="btn btn-gold" id="sync-push-btn" style="margin:0" onclick="syncPushNow()">↑ Push</button>'
      +'<button class="btn btn-ghost" id="sync-pull-btn" style="margin:0" onclick="syncPullNow()">↓ Pull</button>'
      +'</div>'
      +'<button class="btn btn-ghost" style="margin:0" onclick="disconnectSync()">Disconnect</button>'
    ):(
      '<div class="field"><label>Secret Gist ID</label><input id="sync-gist-id" type="text" placeholder="32-character ID from the Gist URL" value="'+(syncConfig.gistId||'')+'"></div>'
      +'<div class="field"><label>Personal Access Token (gist scope)</label><input id="sync-token" type="password" placeholder="ghp_..."></div>'
      +'<button class="btn btn-gold" style="margin:0" onclick="connectSync()">Connect</button>'
    ))
    +'</div>';
}

// PORTFOLIO HELPERS
function pData(pid){return state[pid]||{investments:[],payments:[],nextInvId:1,nextPayId:1};}
function pInfo(pid){return state.portfolios.find(p=>p.id===pid)||{id:pid,name:pid,color:'#8B949E',owner:''};}
function invPaymentsFor(pid,invId){return pData(pid).payments.filter(p=>p.investmentId===invId);}
function actualProfit(pid,inv){return invPaymentsFor(pid,inv.id).reduce((s,p)=>s+Number(p.profit||0),0);}
function outstandingFor(pid,inv){
  const totalReceived=invPaymentsFor(pid,inv.id).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
  const expectedTotal=Number(inv.deployed)+expectedProfit(inv);
  return Math.max(0,expectedTotal-totalReceived);
}
function principalOutstanding(pid,inv){
  const paid=invPaymentsFor(pid,inv.id).reduce((s,p)=>s+Number(p.principal||0),0);
  return Math.max(0,Number(inv.deployed)-paid);
}
function activeInvestments(){
  if(currentPortfolio==='all') return state.portfolios.flatMap(p=>pData(p.id).investments.map(i=>({...i,_pid:p.id,_pname:p.name,_pcolor:p.color})));
  return pData(currentPortfolio).investments.map(i=>({...i,_pid:currentPortfolio,_pname:pInfo(currentPortfolio).name,_pcolor:pInfo(currentPortfolio).color}));
}

// FORMATTERS
function fmt(n){return Number(n).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmt1(n){return Number(n).toLocaleString('en',{minimumFractionDigits:1,maximumFractionDigits:1});}
function fmtHealth(n){return'OMR '+Number(n).toLocaleString('en',{minimumFractionDigits:3,maximumFractionDigits:3});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtMonthYear(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});}
function badge(t,c){return`<span class="badge ${c}">${t}</span>`;}
function statusBadge(s){return badge(s,s==='Active'?'badge-green':'badge-dim');}
function sourceBadge(s){return badge(s,s==='OD Facility'?'badge-blue':s==='Loan'?'badge-purple':'badge-gold');}
function portfolioBadge(pid){const p=pInfo(pid);return`<span class="badge" style="background:${p.color}22;color:${p.color};border-color:${p.color}66">${p.name}</span>`;}
function paymentStatus(pid,inv){
  const pays=invPaymentsFor(pid,inv.id);
  if(pays.filter(p=>Number(p.principal||0)+Number(p.profit||0)>0).length===0) return'No Payment';
  if(principalOutstanding(pid,inv)<=0.01) return'Full Payment';
  return'Partial Payment';
}
function paymentStatusBadge(pid,inv){
  const s=paymentStatus(pid,inv);
  if(s==='No Payment') return badge(s,'badge-dim');
  if(s==='Full Payment') return badge(s,'badge-green');
  return badge(s,'badge-blue');
}
function fmtDuration(m){if(!m)return'—';m=Number(m);if(m<12)return m+'m';const y=Math.floor(m/12),r=m%12;return y+'yr'+(r?' '+r+'m':'');}
function expectedRoi(inv){return Number(inv.roi)*Number(inv.duration||0)/12;}
function expectedProfit(inv){return Number(inv.deployed)*expectedRoi(inv)/100;}
// OD financing cost is tracked once, at the pool level (Capital tab — Utilized Balance × OD rate),
// never per deal: deals draw from one shared cash pool, so no single deal "is" OD-funded, and a
// per-deal charge on top of the pool-level one would double-count it.
// COMMISSION — three ways it can be charged:
//  'cash'         upfront flat fee, paid separately, does not touch deployed capital or returns
//  'pct_invested' commission is a % of the NET invested amount (what you enter as Capital),
//                 added on top — inv.grossCapital stores the resulting total handed over
//                 (net + commission), computed automatically, never entered directly
//  'pct_profit'   full capital is invested; fee is a % of profit earned, reducing the net return
function commissionType(inv){return inv.commissionType||'cash';}
function commissionAmount(inv){
  const t=commissionType(inv);
  if(t==='pct_invested')return Number(inv.deployed||0)*Number(inv.commissionValue||0)/100;
  if(t==='pct_profit')return expectedProfit(inv)*Number(inv.commissionValue||0)/100;
  return Number(inv.commission||0);
}
function commissionLabel(inv){
  const t=commissionType(inv);
  if(t==='pct_invested')return inv.commissionValue+'% of Invested Amount';
  if(t==='pct_profit')return inv.commissionValue+'% of Profit';
  return'Upfront Cash';
}
// Net profit now reflects only the profit-share commission (deal-specific, unrelated to funding
// source) — not OD cost, which lives solely in the Capital pool's liabilities.
function netProfit(inv){
  const profitFee=commissionType(inv)==='pct_profit'?commissionAmount(inv):0;
  return expectedProfit(inv)-profitFee;
}
function netRoi(inv){return Number(inv.deployed)?netProfit(inv)/Number(inv.deployed)*100:0;}
function hasNetAdjustment(inv){return commissionType(inv)==='pct_profit';}

// LOANS — standard reducing-balance amortization
// Standard fixed monthly installment for a reducing-balance loan
function loanMonthlyInstallment(loan){
  const P=Number(loan.principal||0),r=Number(loan.rate||0)/100/12,n=Number(loan.termMonths||0);
  if(!P||!n)return 0;
  if(!r)return P/n;
  return P*r/(1-Math.pow(1+r,-n));
}
function loanPaymentsFor(loanId){
  return state.loanPayments.filter(p=>p.loanId===loanId).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
// Walks a loan's logged payments in date order, splitting each into principal/interest against the
// declining balance (interest = balance × monthly rate at the time of that payment).
// Interest accrues daily on the outstanding balance (annual rate ÷ 365 × actual days elapsed),
// matching standard bank practice — not a flat "annual rate ÷ 12" per payment, which ignores that
// real payment dates rarely fall exactly 30/31 days apart.
function loanAmortizationLog(loan){
  const annualRate=Number(loan.rate||0)/100;
  let balance=Number(loan.principal||0);
  let prevDate=new Date(loan.drawDate);
  const rows=[];
  loanPaymentsFor(loan.id).forEach(p=>{
    const days=Math.max(0,(new Date(p.date)-prevDate)/86400000);
    const interest=+(balance*annualRate/365*days).toFixed(3);
    let principal=+(Number(p.amount)-interest).toFixed(3);
    if(principal>balance)principal=balance; // final payment safety
    balance=+(balance-principal).toFixed(3);
    rows.push({...p,interest,principal,balanceAfter:balance});
    prevDate=new Date(p.date);
  });
  return rows;
}
function loanOutstanding(loan){
  const rows=loanAmortizationLog(loan);
  return rows.length?rows[rows.length-1].balanceAfter:Number(loan.principal||0);
}
function loanInterestPaid(loan){
  return loanAmortizationLog(loan).reduce((s,r)=>s+r.interest,0);
}
// Interest accrued since the last logged payment (or since draw date if none logged), on the
// current outstanding balance — an estimate of financing cost not yet reflected in a real payment.
function loanAccruedSincePayment(loan){
  const rows=loanAmortizationLog(loan);
  const balance=loanOutstanding(loan);
  const since=rows.length?new Date(rows[rows.length-1].date):new Date(loan.drawDate);
  const days=Math.max(0,(new Date()-since)/86400000);
  return balance*(Number(loan.rate||0)/100)*days/365;
}

// ============ FREE CAPITAL POOL ============
// One shared cash pool, fed by Equity, OD, and Loan draws, and by deal payments coming back in;
// drawn down by deal capital going out and by loan/OD repayments. Deals never care where the
// money came from — that's the whole point.
function odUtilizedNow(){
  return(state.odFlows||[]).reduce((s,f)=>s+(f.type==='draw'?Number(f.amount):-Number(f.amount)),0);
}
// Time-weighted interest on the OD's utilized balance as it changed over time, accrued to today.
// OD interest isn't tied to discrete "payments" the way a loan is — it accrues continuously on
// whatever's drawn, the way a real overdraft line works.
function odInterestAccrued(){
  const flows=[...(state.odFlows||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let balance=0,lastDate=null,interest=0;
  const rate=Number(state.odRate||0)/100;
  flows.forEach(f=>{
    const dt=new Date(f.date);
    if(lastDate){const days=Math.max(0,(dt-lastDate)/86400000);interest+=balance*rate*days/365;}
    balance+=f.type==='draw'?Number(f.amount):-Number(f.amount);
    lastDate=dt;
  });
  if(lastDate){const days=Math.max(0,(new Date()-lastDate)/86400000);interest+=balance*rate*days/365;}
  return interest;
}
function poolTotalEquityIn(){return(state.equityFlows||[]).filter(f=>f.type==='injection').reduce((s,f)=>s+Number(f.amount),0);}
function poolTotalEquityOut(){return(state.equityFlows||[]).filter(f=>f.type==='withdrawal').reduce((s,f)=>s+Number(f.amount),0);}
function poolTotalLoanDrawn(){return state.loans.reduce((s,l)=>s+Number(l.principal||0),0);}
function poolTotalLoanPaid(){return(state.loanPayments||[]).reduce((s,p)=>s+Number(p.amount||0),0);}
function poolTotalLoanOutstanding(){return state.loans.reduce((s,l)=>s+loanOutstanding(l),0);}
function poolTotalLoanAccruedUnpaid(){return state.loans.reduce((s,l)=>s+loanAccruedSincePayment(l),0);}
function poolTotalOdDrawn(){return(state.odFlows||[]).filter(f=>f.type==='draw').reduce((s,f)=>s+Number(f.amount),0);}
function poolTotalOdRepaid(){return(state.odFlows||[]).filter(f=>f.type==='repayment').reduce((s,f)=>s+Number(f.amount),0);}
function poolAllDeals(){return state.portfolios.flatMap(p=>pData(p.id).investments.map(i=>({...i,_pid:p.id})));}
function poolTotalDeployedAllTime(){
  const now=new Date();
  return poolAllDeals().filter(i=>new Date(i.date)<=now).reduce((s,i)=>{
    const gross=Number(i.grossCapital||i.deployed);
    const cashCommission=commissionType(i)==='cash'?Number(i.commission||0):0;
    return s+gross+cashCommission;
  },0);
}
function poolTotalReceivedAllTime(){
  return state.portfolios.flatMap(p=>pData(p.id).payments).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
}
function poolTotalProfitReceived(){
  return state.portfolios.flatMap(p=>pData(p.id).payments).reduce((s,p)=>s+Number(p.profit||0),0);
}
// Current uninvested cash sitting in the pool. If negative, the ledger is incomplete — deals were
// funded with capital that was never logged as an Equity/OD/Loan inflow.
function freeCapitalBalance(){
  return poolTotalEquityIn()-poolTotalEquityOut()
    +poolTotalLoanDrawn()-poolTotalLoanPaid()
    +poolTotalOdDrawn()-poolTotalOdRepaid()
    -poolTotalDeployedAllTime()+poolTotalReceivedAllTime();
}
// Book value of capital still tied up in active deals (deployed minus principal already returned) —
// deliberately conservative: no markup for unrealized expected profit on open deals.
function poolActiveDealsBookValue(){
  const now=new Date();
  return poolAllDeals().filter(i=>effectiveStatus(i._pid,i)==='Active'&&new Date(i.date)<=now).reduce((s,i)=>s+principalOutstanding(i._pid,i),0);
}
function poolTotalAssets(){return freeCapitalBalance()+poolActiveDealsBookValue();}
function poolTotalLiabilities(){return poolTotalLoanOutstanding()+poolTotalLoanAccruedUnpaid()+odUtilizedNow()+odInterestAccrued();}
function poolEquityValue(){return poolTotalAssets()-poolTotalLiabilities();}

// XIRR — simple bisection solver on dated cash flows: [{amt, date}]
function xnpv(rate,flows){
  const base=flows.reduce((min,f)=>f.date<min?f.date:min,flows[0].date);
  return flows.reduce((s,f)=>s+f.amt/Math.pow(1+rate,(f.date-base)/86400000/365),0);
}
function solveXirr(flows){
  if(flows.length<2)return null;
  const hasNeg=flows.some(f=>f.amt<0),hasPos=flows.some(f=>f.amt>0);
  if(!hasNeg||!hasPos)return null;
  let lo=-0.99,hi=10;
  for(let i=0;i<200;i++){
    const mid=(lo+hi)/2;
    if(xnpv(mid,flows)>0)lo=mid;else hi=mid;
  }
  return(lo+hi)/2;
}
// Blended: every capital source (equity+loan+OD) treated as equal-cost. Payoff = total pool value
// (idle cash + book value of what's still deployed), regardless of who financed it.
function blendedXirr(){
  const flows=[];
  (state.equityFlows||[]).forEach(f=>flows.push({amt:f.type==='injection'?-Number(f.amount):Number(f.amount),date:new Date(f.date)}));
  (state.odFlows||[]).forEach(f=>flows.push({amt:f.type==='draw'?-Number(f.amount):Number(f.amount),date:new Date(f.date)}));
  state.loans.forEach(l=>flows.push({amt:-Number(l.principal),date:new Date(l.drawDate)}));
  (state.loanPayments||[]).forEach(p=>flows.push({amt:Number(p.amount),date:new Date(p.date)}));
  flows.push({amt:poolTotalAssets(),date:new Date()});
  return solveXirr(flows);
}
// True Equity: only your own money in/out, payoff = what's left after lenders are paid in full
// (principal + accrued interest) — the number that actually answers "how did MY money do."
function equityXirr(){
  const flows=[];
  (state.equityFlows||[]).forEach(f=>flows.push({amt:f.type==='injection'?-Number(f.amount):Number(f.amount),date:new Date(f.date)}));
  flows.push({amt:poolEquityValue(),date:new Date()});
  return solveXirr(flows);
}
// One-time helper: reconstructs the minimum equity injections that WOULD have been needed to fund
// every deal to date, assuming zero idle cash and excluding known Loan/OD-funded deals. Used only
// to suggest a starting point for backfilling historical Equity entries — never runs automatically.
function suggestHistoricalEquity(){
  const now=new Date();
  const events=[];
  poolAllDeals().forEach(i=>{
    if(new Date(i.date)>now)return;
    const gross=Number(i.grossCapital||i.deployed);
    const cashCommission=commissionType(i)==='cash'?Number(i.commission||0):0;
    events.push({date:new Date(i.date),type:'debit',amt:gross+cashCommission,label:i.company});
  });
  state.portfolios.forEach(p=>pData(p.id).payments.forEach(pay=>{
    const credit=Number(pay.principal||0)+Number(pay.profit||0);
    if(credit>0)events.push({date:new Date(pay.date),type:'credit',amt:credit,label:pay.company});
  }));
  (state.loans||[]).forEach(l=>events.push({date:new Date(l.drawDate),type:'credit',amt:Number(l.principal),label:l.name+' (loan draw)'}));
  (state.odFlows||[]).forEach(f=>events.push({date:new Date(f.date),type:f.type==='draw'?'credit':'debit',amt:Number(f.amount),label:'OD '+f.type}));
  events.sort((a,b)=>a.date-b.date||(a.type==='credit'?-1:1));
  let wallet=0;const suggestions=[];
  events.forEach(e=>{
    if(e.type==='credit'){wallet+=e.amt;}
    else{
      if(wallet<e.amt-0.01){const shortfall=e.amt-wallet;suggestions.push({date:e.date.toISOString().split('T')[0],amount:+shortfall.toFixed(2),label:'to fund '+e.label});wallet+=shortfall;}
      wallet-=e.amt;
    }
  });
  return suggestions;
}
// Auto-derived status: a deal is effectively Closed once principal + profit are both fully received,
// even if no one has manually flipped the status field. Manual "Closed" is always respected.
function effectiveStatus(pid,inv){
  if(inv.status==='Closed')return'Closed';
  return outstandingFor(pid,inv)<=0.01?'Closed':inv.status;
}
// True when principal is fully repaid but profit/interest is still outstanding
function profitPending(pid,inv){
  return principalOutstanding(pid,inv)<=0.01&&outstandingFor(pid,inv)>0.01;
}

// CONCENTRATION RISK
// Strips trailing sequence/repeat markers so repeat deals with the same borrower group together
// e.g. "Union Trading 1/2/3", "Complete Energy Services (2)", "Action Film Oman II"
const CONC_HIGH=25,CONC_MED=15; // % of active capital thresholds
function baseCompanyName(name){
  return String(name||'').trim()
    .replace(/\s*\(\d+\)\s*$/,'')
    .replace(/\s*#\d+\s*$/,'')
    .replace(/\s+\d+$/,'')
    .replace(/\s+(I{1,3}|IV|V)$/i,'')
    .trim()||String(name||'').trim();
}
function concentrationBand(pct){
  if(pct>=CONC_HIGH)return{label:'High',color:'var(--red)'};
  if(pct>=CONC_MED)return{label:'Medium',color:'var(--orange)'};
  return{label:'Low',color:'var(--green)'};
}
// Groups currently-active deployed capital by borrower (base company name).
// Only active exposure counts — capital already repaid is no longer at risk.
function concentrationGroups(invs){
  const activeInvs=invs.filter(i=>effectiveStatus(i._pid,i)==='Active');
  const total=activeInvs.reduce((s,i)=>s+Number(i.deployed),0);
  const map=new Map();
  activeInvs.forEach(i=>{
    const key=baseCompanyName(i.company);
    if(!map.has(key))map.set(key,{name:key,deployed:0,count:0});
    const g=map.get(key);
    g.deployed+=Number(i.deployed);
    g.count++;
  });
  return[...map.values()].map(g=>({...g,pct:total?g.deployed/total*100:0})).sort((a,b)=>b.deployed-a.deployed);
}

// TOTALS
function totalsFor(invs,pays,pid){
  const deployed=invs.reduce((s,i)=>s+Number(i.deployed),0);
  const expProfit=invs.reduce((s,i)=>s+expectedProfit(i),0);
  const actProfit=invs.reduce((s,i)=>s+actualProfit(i._pid||pid,i),0);
  const repaid=pays.reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
  return{
    deployed,
    annualProfit:invs.reduce((s,i)=>s+(Number(i.deployed)*Number(i.roi)/100),0),
    expProfit,
    actProfit,
    hasCommissionAdj:invs.some(i=>commissionType(i)==='pct_profit'),
    netExpProfit:invs.reduce((s,i)=>s+netProfit(i),0),
    repaid,
    avgExpRoi:deployed?expProfit/deployed*100:0,
    avgActRoi:repaid?actProfit/repaid*100:0,
    active:invs.filter(i=>effectiveStatus(i._pid||pid,i)==='Active').length,
    total:invs.length,
  };
}
function payStatusSummaryFor(pid,invs){
  const g={'No Payment':[],'Partial Payment':[],'Full Payment':[]};
  invs.forEach(inv=>g[paymentStatus(pid,inv)].push(inv));
  return['No Payment','Partial Payment','Full Payment'].map(label=>{
    const a=g[label];
    return{label,count:a.length,
      totalOutstanding:a.reduce((s,i)=>s+outstandingFor(pid,i),0),
      totalReceived:a.reduce((s,i)=>s+invPaymentsFor(pid,i.id).reduce((ss,p)=>ss+Number(p.principal||0)+Number(p.profit||0),0),0),
    };
  });
}

// RENDER
function render(){
  const active=document.activeElement;
  const activeId=active&&active.id;
  const selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
  const selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  const viewEl=document.getElementById('view');
  const scrollTop=viewEl?viewEl.scrollTop:0;
  const listEl=document.querySelector('.split-list'),detEl=document.querySelector('.split-detail');
  const listScroll=listEl?listEl.scrollTop:0,detScroll=detEl?detEl.scrollTop:0,detKey=detailPortfolio+'|'+detailId;
  Object.values(rptChartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  rptChartInstances={};
  Object.values(anlChartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  anlChartInstances={};
  Object.values(dashChartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  dashChartInstances={};
  renderPortBar();renderTopNav();renderView();renderFab();
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null&&el.setSelectionRange){try{el.setSelectionRange(selStart,selEnd);}catch(e){}}
    }
  }
  // Keep the scroll position when re-rendering the same page; start at the top of a new one
  const newViewEl=document.getElementById('view');
  if(newViewEl&&currentTab===_lastRenderedTab)newViewEl.scrollTop=scrollTop;
  _lastRenderedTab=currentTab;
  const nl=document.querySelector('.split-list'),nd=document.querySelector('.split-detail');
  if(nl&&listEl)nl.scrollTop=listScroll;
  if(nd&&detEl&&detKey===detailPortfolio+'|'+detailId)nd.scrollTop=detScroll;
}

// RESPONSIVE LAYOUT — the same screens re-arrange by width: phone (stacked, top tabs),
// fold (≥720px: side rail, two-column pages, deals list beside the selected deal) and
// desktop (≥1100px: labelled sidebar, deals as a sortable table, forms in a side panel).

const MQ_FOLD=window.matchMedia('(min-width:720px)'),MQ_DESK=window.matchMedia('(min-width:1100px)');
function layoutMode(){return MQ_DESK.matches?'desktop':MQ_FOLD.matches?'fold':'phone';}

function onLayoutChange(){
  const m=layoutMode();

  _layoutMode=m;
  if(_unlocked)render();
}
[MQ_FOLD,MQ_DESK].forEach(mq=>mq.addEventListener?mq.addEventListener('change',onLayoutChange):mq.addListener(onLayoutChange));

// DASHBOARD — attention first: what's working, what's due, what's late, then the detail.
// Scope is the selected portfolio, or every portfolio in the "All" view.
const QUIET_DAYS=90; // an active deal with no receipt for this long is worth a follow-up
function dashScope(){
  const ports=currentPortfolio==='all'?state.portfolios:state.portfolios.filter(p=>p.id===currentPortfolio);
  const invs=ports.flatMap(p=>pData(p.id).investments.map(i=>({...i,_pid:p.id,_pname:p.name,_pcolor:p.color})));
  const pays=ports.flatMap(p=>pData(p.id).payments);
  return{ports,invs,pays};
}
function lastReceiptDate(pid,inv){
  const ds=invPaymentsFor(pid,inv.id).filter(p=>Number(p.principal||0)+Number(p.profit||0)>0).map(p=>new Date(p.date));
  return ds.length?new Date(Math.max(...ds)):null;
}
// Deals needing a follow-up: past maturity with money outstanding, maturing within 30 days,
// or active but silent (no receipt) for QUIET_DAYS or more.
function dashActionItems(invs){
  const now=new Date();
  const col=collectionsList(invs);
  const seen=new Set();
  const items=[];
  col.overdue.forEach(i=>{seen.add(i._pid+'|'+i.id);items.push({inv:i,amt:i._out,rank:0,days:-i._days,color:'var(--red)',reason:Math.abs(i._days)+' days past maturity'});});
  col.upcoming.forEach(i=>{seen.add(i._pid+'|'+i.id);items.push({inv:i,amt:i._out,rank:1,days:i._days,color:'var(--gold)',reason:i._days===0?'Matures today':'Matures in '+i._days+' day'+(i._days!==1?'s':'')});});
  invs.forEach(i=>{
    if(seen.has(i._pid+'|'+i.id)||effectiveStatus(i._pid,i)!=='Active')return;
    const start=new Date(i.date);if(start>now)return;
    const last=lastReceiptDate(i._pid,i)||start;
    const days=Math.floor((now-last)/86400000);
    if(days<QUIET_DAYS)return;
    items.push({inv:i,amt:outstandingFor(i._pid,i),rank:2,days,color:'var(--orange)',reason:(lastReceiptDate(i._pid,i)?'No payment for ':'Nothing received in ')+days+' days'});
  });
  items.sort((a,b)=>a.rank-b.rank||(a.rank===1?a.days-b.days:b.days-a.days));
  return items;
}

    +'<button class="dash-log-btn" onclick="event.stopPropagation();openAddPaymentForDeal('+i.id+',\''+i._pid+'\')">+ Log</button>'
    +'</div>';}).join('')
    +(items.length>LIMIT?'<button onclick="toggleCashFlowBucket(\'dash-actions\')" style="width:100%;background:transparent;border:none;border-top:1px solid var(--border);color:var(--gold);font-size:12px;font-weight:600;padding:10px 0;cursor:pointer">'+(open?'Show Less':'Show '+(items.length-LIMIT)+' More')+'</button>':'');

function initDashboardCharts(){
  const c=document.getElementById('dash-flow');
  if(!c||typeof Chart==='undefined')return;
  const{invs,pays}=dashScope();
  const now=new Date(),gc='rgba(48,54,61,0.8)';
  const monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const months=[];for(let i=-5;i<=6;i++)months.push(new Date(now.getFullYear(),now.getMonth()+i,1));
  const rec={},due={};
  pays.forEach(p=>{const k=String(p.date).slice(0,7);rec[k]=(rec[k]||0)+Number(p.principal||0)+Number(p.profit||0);});
  const thisKey=monthKey(now);
  invs.forEach(i=>{
    if(effectiveStatus(i._pid,i)!=='Active')return;
    const out=outstandingFor(i._pid,i),mat=maturityDate(i);
    if(out<=0.01||!mat)return;
    const k=mat<new Date(now.getFullYear(),now.getMonth(),1)?thisKey:monthKey(mat); // overdue rolls into this month
    due[k]=(due[k]||0)+out;
  });
  const keys=months.map(monthKey);
  Chart.defaults.color='rgba(255,255,255,0.7)';
  Chart.defaults.font={family:'Inter',size:11};
  dashChartInstances.flow=new Chart(c,{type:'bar',data:{labels:months.map(m=>m.toLocaleDateString('en-GB',{month:'short',year:'2-digit'})),datasets:[
    {label:'Received',data:keys.map(k=>k<=thisKey?+(rec[k]||0).toFixed(2):0),backgroundColor:'#58A6FFAA',borderRadius:4,borderSkipped:false,stack:'s'},
    {label:'Maturing',data:keys.map(k=>k>=thisKey?+(due[k]||0).toFixed(2):0),backgroundColor:'#C9A84C88',borderRadius:4,borderSkipped:false,stack:'s'}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+ctx.dataset.label+': OMR '+Number(ctx.raw).toLocaleString()}}},
      scales:{x:{stacked:true,grid:{color:gc},ticks:{font:{size:9}}},y:{stacked:true,grid:{color:gc},ticks:{callback:v=>Number(v)>=1000?(Number(v)/1000)+'k':v}}}}});
}

function detailHTML(){

  const pays=invPaymentsFor(pid,inv.id).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const mat=maturityDate(inv),overdue=isOverdue(inv,pid),pending=profitPending(pid,inv),isOd=hasNetAdjustment(inv),cType=commissionType(inv),commAmt=commissionAmount(inv);
  const metrics=[];
  if(cType==='pct_invested')metrics.push({label:'Capital Committed (Gross)',val:fmt(inv.grossCapital||inv.deployed),color:'var(--gold-light)'});
  metrics.push({label:cType==='pct_invested'?'Capital Deployed (Net)':'Capital Deployed',val:fmt(inv.deployed),color:'var(--gold-light)'});
  metrics.push(
    {label:'Duration',val:fmtDuration(inv.duration),color:'var(--text)'},
    {label:'Start Date',val:fmtDate(inv.date),color:'var(--text)'},
    {label:'Maturity Date',val:mat?fmtMonthYear(mat)+(overdue?' (overdue)':''):'—',color:overdue?'var(--red)':'var(--text)'},
    {label:'Annual Rate',val:`${inv.roi}% p.a.`,color:'var(--gold)'},
    {label:'Return over Full Term',val:`${expectedRoi(inv).toFixed(1)}%`,color:'var(--purple)'},
    {label:'Expected Profit',val:fmt(expectedProfit(inv)),color:'var(--green)'},
    {label:'Actual Profit Received',val:fmt(actualProfit(pid,inv)),color:'var(--blue)'},

  metrics.push({label:'Outstanding vs Expected Return',val:fmt(out),color:'var(--blue)'});

    </div>

function getReportData(){
  let invs=state.portfolios.flatMap(p=>pData(p.id).investments.map(i=>({...i,_pid:p.id,_pname:pInfo(p.id).name,_pcolor:pInfo(p.id).color})));
  if(rptFilters.portfolio!=='all') invs=invs.filter(i=>i._pid===rptFilters.portfolio);
  if(rptFilters.year!=='all') invs=invs.filter(i=>new Date(i.date).getFullYear()===parseInt(rptFilters.year));
  if(rptFilters.payStatus!=='all') invs=invs.filter(i=>paymentStatus(i._pid,i)===rptFilters.payStatus);
  if(rptFilters.fundSource!=='all') invs=invs.filter(i=>i.fundSource===rptFilters.fundSource);
  if(rptFilters.returnYear!=='all'){
    invs=invs.filter(i=>{
      const end=new Date(new Date(i.date).getTime()+Number(i.duration||0)*30.44*24*3600*1000);
      return end.getFullYear()===parseInt(rptFilters.returnYear);
    });
  }
  return invs;
}

}

function initReportCharts(){
  const invs=getReportData();
  Chart.defaults.color='rgba(255,255,255,0.7)';
  Chart.defaults.font={family:'Inter',size:11};
  const gc='rgba(48,54,61,0.8)';
  // Bar - deployed by year
  const byYear={};
  invs.forEach(i=>{const y=new Date(i.date).getFullYear();byYear[y]=(byYear[y]||0)+Number(i.deployed);});
  const bY=Object.keys(byYear).sort();
  const c1=document.getElementById('chart-bar');
  if(c1) rptChartInstances.bar=new Chart(c1,{type:'bar',data:{labels:bY,datasets:[{data:bY.map(y=>byYear[y]),backgroundColor:'#C9A84C99',borderRadius:6,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' OMR '+ctx.raw.toLocaleString()}}},scales:{x:{grid:{color:gc}},y:{grid:{color:gc},ticks:{callback:v=>'OMR '+Number(v).toLocaleString()}}}}});
  // Donut - payment status
  const psC={'No Payment':0,'Partial Payment':0,'Full Payment':0};
  invs.forEach(i=>psC[paymentStatus(i._pid,i)]++);
  const c2=document.getElementById('chart-donut');
  if(c2) rptChartInstances.donut=new Chart(c2,{type:'doughnut',data:{labels:Object.keys(psC),datasets:[{data:Object.values(psC),backgroundColor:['#484F58','#58A6FF','#3FB950'],borderColor:'#0D1117',borderWidth:3}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{padding:16,boxWidth:12}}}}});
  // Horizontal bar - ROI per deal
  const top=invs.slice().sort((a,b)=>expectedRoi(b)-expectedRoi(a)).slice(0,15);
  const c3=document.getElementById('chart-roi');
  if(c3) rptChartInstances.roi=new Chart(c3,{type:'bar',data:{labels:top.map(i=>i.company.length>18?i.company.slice(0,16)+'…':i.company),datasets:[{data:top.map(i=>+expectedRoi(i).toFixed(2)),backgroundColor:top.map(i=>i._pcolor+'CC'),borderRadius:4,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw}%`}}},scales:{x:{grid:{color:gc},ticks:{callback:v=>v+'%'}},y:{grid:{color:'transparent'},ticks:{font:{size:10}}}}}});
  // Line - cumulative
  const ap=invs.flatMap(i=>invPaymentsFor(i._pid,i.id)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  let cum=0;const ll=[],ld=[];
  ap.forEach(p=>{cum+=Number(p.principal||0)+Number(p.profit||0);ll.push(fmtDate(p.date));ld.push(+cum.toFixed(2));});
  const c4=document.getElementById('chart-line');
  if(c4) rptChartInstances.line=new Chart(c4,{type:'line',data:{labels:ll,datasets:[{label:'Cumulative (OMR)',data:ld,borderColor:'#C9A84C',backgroundColor:'rgba(201,168,76,0.1)',borderWidth:2,pointRadius:3,pointBackgroundColor:'#C9A84C',tension:0.3,fill:true}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' OMR '+ctx.raw.toLocaleString()}}},scales:{x:{grid:{color:gc},ticks:{maxRotation:45,font:{size:9}}},y:{grid:{color:gc},ticks:{callback:v=>'OMR '+Number(v).toLocaleString()}}}}});
}

// MODALS
// Truncates a long list of pre-rendered row HTML to state.capitalRowLimit, with a
// Show More / Show Less toggle. key identifies this list so its expand state persists
// across re-renders (e.g. 'equity', 'od', or a loan id for its payment list).
function limitedListHTML(rowsHtml,key){
  const limit=Math.max(1,Number(state.capitalRowLimit||7));
  if(rowsHtml.length<=limit)return rowsHtml.join('');
  const expanded=capitalListExpanded.has(key);
  const shown=expanded?rowsHtml:rowsHtml.slice(0,limit);
  const hiddenCount=rowsHtml.length-limit;
  return shown.join('')
    +'<button onclick="toggleCapitalList(\''+key+'\')" style="width:100%;background:transparent;border:none;border-top:1px solid var(--border);color:var(--gold);font-size:12px;font-weight:600;padding:10px 0;cursor:pointer">'
    +(expanded?'Show Less':'Show '+hiddenCount+' More')+'</button>';
}
function toggleCapitalList(key){
  if(capitalListExpanded.has(key))capitalListExpanded.delete(key);else capitalListExpanded.add(key);
  render();
}
function updateCapitalRowLimit(v){
  const n=parseInt(v);
  if(isNaN(n)||n<1){showToast('Enter a valid number',true);return;}
  state.capitalRowLimit=n;
  capitalListExpanded.clear();
  saveState();render();
}

// Pre-commitment concentration check: shows what exposure to this borrower (and the
// portfolio's overall concentration) would look like if this deal is saved as entered.
// excludeId lets the Edit form ignore the deal's own current amount when recomputing "existing" exposure.
function updateConcentrationPreview(excludeId){
  const box=document.getElementById('conc-preview');
  if(!box)return;
  const pidEl=document.getElementById('m-pid'),companyEl=document.getElementById('m-company'),depEl=document.getElementById('m-deployed');
  if(!pidEl||!companyEl||!depEl)return;
  const pid=pidEl.value,company=companyEl.value.trim(),deployed=parseFloat(depEl.value);
  if(!company||isNaN(deployed)||deployed<=0){box.innerHTML='';return;}
  const base=baseCompanyName(company);
  const existing=pData(pid).investments.filter(i=>effectiveStatus(pid,i)==='Active'&&(excludeId==null||i.id!==excludeId));
  const existingTotal=existing.reduce((s,i)=>s+Number(i.deployed),0);
  const sameCompany=existing.filter(i=>baseCompanyName(i.company)===base);
  const existingCompany=sameCompany.reduce((s,i)=>s+Number(i.deployed),0);
  const newTotal=existingTotal+deployed;
  const newCompanyExposure=existingCompany+deployed;
  const pct=newTotal?newCompanyExposure/newTotal*100:0;
  const band=concentrationBand(pct);
  box.innerHTML='<div style="background:'+band.color+'11;border:1px solid '+band.color+'55;border-radius:10px;padding:10px 12px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'
    +'<div style="color:var(--text);font-size:12px;font-weight:600">Concentration if committed</div>'
    +'<span class="badge" style="background:'+band.color+'22;color:'+band.color+';border-color:'+band.color+'66">'+pct.toFixed(1)+'% · '+band.label+'</span>'
    +'</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-top:4px">'+base+(sameCompany.length?' already has '+fmt(existingCompany)+' deployed across '+sameCompany.length+' active deal'+(sameCompany.length>1?'s':'')+'. ':' has no prior active exposure. ')
    +'This deal would bring it to '+fmt(newCompanyExposure)+' — '+pct.toFixed(1)+'% of '+fmt(newTotal)+' total active capital.</div>'
    +(band.label==='High'?'<div style="color:var(--red);font-size:11px;margin-top:6px;font-weight:600">⚠ This exceeds the '+CONC_HIGH+'% concentration threshold — consider reducing the size or declining.</div>':'')
    +'</div>';
}

  const type=document.getElementById('m-comm-type').value;
  const cash=document.getElementById('comm-cash-fields'),pi=document.getElementById('comm-pctinv-fields'),pp=document.getElementById('comm-pctprofit-fields');
  if(cash)cash.style.display=type==='cash'?'block':'none';

// Resolves the three commission modes into what actually gets stored: deployed (net, ROI-earning,
// always exactly what's entered as Capital), grossCapital (only set for pct_invested — net +
// commission, computed automatically), commission (flat OMR, only for cash), commissionValue (%).
function readCommissionFields(enteredCapital){
  const type=document.getElementById('m-comm-type').value;
  let deployed=enteredCapital,grossCapital=null,commission=0,commissionValue=0;
  if(type==='pct_invested'){
    commissionValue=parseFloat(document.getElementById('m-comm-pct-invested').value)||0;
    grossCapital=+(deployed*(1+commissionValue/100)).toFixed(2);
  }else if(type==='pct_profit'){
    commissionValue=parseFloat(document.getElementById('m-comm-pct-profit').value)||0;
  }else{
    commission=parseFloat(document.getElementById('m-commission').value)||0;
  }
  return{deployed,grossCapital,commission,commissionType:type,commissionValue};
}

function csvEscape(v){
  const s=v===null||v===undefined?'':String(v);

}
function downloadFile(filename,content,mime){
  const a=document.createElement('a');

  a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// MATURITY REMINDERS (.ics)
function icsDate(d){return d.toISOString().split('T')[0].replace(/-/g,'');}
function exportMaturityReminders(){
  const now=new Date();
  const events=[];
  state.portfolios.forEach(p=>{
    pData(p.id).investments.forEach(inv=>{
      if(effectiveStatus(p.id,inv)!=='Active')return;
      const mat=maturityDate(inv);
      if(!mat)return;
      const out=outstandingFor(p.id,inv);
      events.push({uid:'deal-'+p.id+'-'+inv.id+'@investment-tracker',date:mat,summary:'Deal Maturity: '+inv.company+' ('+p.name+')',desc:'Outstanding: '+fmt(out)+'. Capital: '+fmt(inv.deployed)+' at '+inv.roi+'% p.a.'});
    });
  });
  if(!events.length){showToast('No active deals with a maturity date',true);return;}
  const stamp=icsDate(now)+'T000000Z';
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Investment Portfolio Tracker//EN\r\nCALSCALE:GREGORIAN\r\n';
  events.forEach(ev=>{
    const dtStart=new Date(ev.date);
    const dtEnd=new Date(dtStart.getTime()+86400000);
    ics+='BEGIN:VEVENT\r\nUID:'+ev.uid+'\r\nDTSTAMP:'+stamp+'\r\nDTSTART;VALUE=DATE:'+icsDate(dtStart)+'\r\nDTEND;VALUE=DATE:'+icsDate(dtEnd)+'\r\nSUMMARY:'+ev.summary+'\r\nDESCRIPTION:'+ev.desc+'\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Deal maturing soon\r\nTRIGGER:-P7D\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  downloadFile('deal-maturity-reminders.ics',ics,'text/calendar');
  showToast(events.length+' reminder'+(events.length!==1?'s':'')+' downloaded ✓');
}

function importData(e){
  _externalUiUntil=0;markActive();
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const p=JSON.parse(ev.target.result);
      const inc=p.data||p;
      if(!inc.portfolios){showToast('Invalid backup file',true);return;}
      window._pi=inc;
      showModal(`<div class="modal-handle"></div><div class="modal-title">Import Backup?</div><div style="color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:20px">This backup contains <b style="color:var(--text)">${inc.portfolios.length} portfolios</b>.<br><br><b style="color:var(--red)">All current data will be replaced.</b></div><button class="btn btn-gold" onclick="doImport()">Yes, Import</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`);
    }catch(err){showToast('Could not read file',true);}
  };
  r.readAsText(file);e.target.value='';
}

function saveEditPayment(){
  const ctx=window._editPay;
  if(!ctx){showToast('Session lost — please reopen',true);return;}
  const pid=ctx.pid;
  const id=ctx.id;
  const invId=ctx.invId;
  const principalEl=document.getElementById('m-principal');
  const profitEl=document.getElementById('m-profit');
  if(!principalEl||!profitEl){showToast('Form fields missing',true);return;}
  const principal=parseFloat(principalEl.value)||0;
  const profit=parseFloat(profitEl.value)||0;
  const date=document.getElementById('m-date').value;
  const notes=document.getElementById('m-notes').value.trim();
  if(principal<=0&&profit<=0){showToast('Enter at least a principal or profit amount',true);return;}
  const pd=pData(pid);

  if(!inv){showToast('Deal not found',true);return;}
  const rec=pd.payments.find(x=>x.id===id);

function getAllPayments(){

  );
