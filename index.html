*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:14px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

.port-btn{flex-shrink:0;background:none;border:none;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;padding:10px 12px;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;font-family:inherit}
.port-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 80px}
.view::-webkit-scrollbar{display:none}
.nav{display:none}

.badge-dim{background:var(--card);color:var(--muted);border-color:var(--border)}

.badge-gold{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-dim)}
.badge-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid;transition:all 0.2s}
.chip-active{background:var(--gold);color:#000;border-color:var(--gold)}
.chip-inactive{background:var(--card);color:var(--muted);border-color:var(--border)}
.sel-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:12px;font-family:inherit;-webkit-appearance:none;cursor:pointer;flex:1;min-width:120px}

.mini-bar-bg{background:var(--border);border-radius:4px;height:4px;width:100%;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.fab{position:fixed;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#000;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(201,168,76,0.4);z-index:100;transition:transform 0.15s}

<script>
// Inline manifest injected as blob so it works from local file
const _manifest = {
  name: "Investment Portfolio Tracker",
  short_name: "Portfolio",

      sizes: "512x512",
      type: "image/svg+xml",
      purpose: "any maskable"
    }
  ],
  categories: ["finance", "productivity"]
};
const _blob = new Blob([JSON.stringify(_manifest)], {type:'application/json'});
document.getElementById('pwa-manifest').href = URL.createObjectURL(_blob);

// Service Worker registration for offline capability
if('serviceWorker' in navigator){
  const _swCode = `
const CACHE='ipt-v1';
const ASSETS=[
  'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap',
  'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js'
];
self.addEventListener('install', e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS).catch(()=>{})));
  self.skipWaiting();
});
self.addEventListener('activate', e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e=>{
  if(e.request.method!=='GET') return;
  e.respondWith(
    caches.match(e.request).then(cached=>{
      if(cached) return cached;
      return fetch(e.request).then(resp=>{
        if(resp&&resp.status===200){
          const clone=resp.clone();
          caches.open(CACHE).then(c=>c.put(e.request,clone));
        }
        return resp;
      }).catch(()=>cached);
    })
  );
});
  `;
  const _swBlob = new Blob([_swCode], {type:'application/javascript'});
  const _swUrl = URL.createObjectURL(_swBlob);
  navigator.serviceWorker.register(_swUrl, {scope: './'})
    .then(()=>console.log('SW registered'))
    .catch(e=>console.warn('SW failed (normal for local file):', e));
}
</script>

// PORTFOLIO HELPERS
function pData(pid){return state[pid]||{investments:[],payments:[],nextInvId:1,nextPayId:1};}
function pInfo(pid){return state.portfolios.find(p=>p.id===pid)||{id:pid,name:pid,color:'#8B949E',owner:''};}
function invPaymentsFor(pid,invId){return pData(pid).payments.filter(p=>p.investmentId===invId);}
function actualProfit(pid,inv){return invPaymentsFor(pid,inv.id).reduce((s,p)=>s+Number(p.profit||0),0);}
function outstandingFor(pid,inv){
  const totalReceived=invPaymentsFor(pid,inv.id).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
  const expectedTotal=Number(inv.deployed)+expectedProfit(inv);
  return Math.max(0,expectedTotal-totalReceived);
}
function principalOutstanding(pid,inv){
  const paid=invPaymentsFor(pid,inv.id).reduce((s,p)=>s+Number(p.principal||0),0);
  return Math.max(0,Number(inv.deployed)-paid);
}
function activeInvestments(){
  if(currentPortfolio==='all') return state.portfolios.flatMap(p=>pData(p.id).investments.map(i=>({...i,_pid:p.id,_pname:p.name,_pcolor:p.color})));
  return pData(currentPortfolio).investments.map(i=>({...i,_pid:currentPortfolio,_pname:pInfo(currentPortfolio).name,_pcolor:pInfo(currentPortfolio).color}));
}

// FORMATTERS
function fmt(n){return Number(n).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmt1(n){return Number(n).toLocaleString('en',{minimumFractionDigits:1,maximumFractionDigits:1});}
function fmtHealth(n){return'OMR '+Number(n).toLocaleString('en',{minimumFractionDigits:3,maximumFractionDigits:3});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtMonthYear(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});}
function badge(t,c){return`<span class="badge ${c}">${t}</span>`;}
function statusBadge(s){return badge(s,s==='Active'?'badge-green':'badge-dim');}
function sourceBadge(s){return badge(s,s==='OD Facility'?'badge-blue':s==='Loan'?'badge-purple':'badge-gold');}
function portfolioBadge(pid){const p=pInfo(pid);return`<span class="badge" style="background:${p.color}22;color:${p.color};border-color:${p.color}66">${p.name}</span>`;}
function paymentStatus(pid,inv){
  const pays=invPaymentsFor(pid,inv.id);
  if(pays.filter(p=>Number(p.principal||0)+Number(p.profit||0)>0).length===0) return'No Payment';
  if(principalOutstanding(pid,inv)<=0.01) return'Full Payment';
  return'Partial Payment';
}
function paymentStatusBadge(pid,inv){
  const s=paymentStatus(pid,inv);
  if(s==='No Payment') return badge(s,'badge-dim');
  if(s==='Full Payment') return badge(s,'badge-green');
  return badge(s,'badge-blue');
}
function fmtDuration(m){if(!m)return'—';m=Number(m);if(m<12)return m+'m';const y=Math.floor(m/12),r=m%12;return y+'yr'+(r?' '+r+'m':'');}
function expectedRoi(inv){return Number(inv.roi)*Number(inv.duration||0)/12;}
function expectedProfit(inv){return Number(inv.deployed)*expectedRoi(inv)/100;}
// OD Facility financing cost — deducted from gross profit to show the true net return
// OD financing cost is now tracked once, correctly, at the pool level (Capital tab — Utilized
// Balance × OD rate). It is deliberately NOT subtracted here anymore: under the Free Capital pool
// model, deals draw from one shared cash pool, so there's no honest way to say a specific deal
// "is" OD-funded. Charging OD cost per-deal on top of the pool-level charge would double-count it.
function odFinancingCost(inv){
  if(inv.fundSource!=='OD Facility')return 0;
  return Number(inv.deployed)*Number(state.odRate||0)/100*Number(inv.duration||0)/12;
}
// COMMISSION — three ways it can be charged:
//  'cash'         upfront flat fee, paid separately, does not touch deployed capital or returns
//  'pct_invested' agent deducts a % of the gross capital handed over before investing the rest
//  'pct_invested' commission is a % of the NET invested amount (what you enter as Capital),
//                 added on top — inv.grossCapital stores the resulting total handed over
//                 (net + commission), computed automatically, never entered directly
//  'pct_profit'   full capital is invested; fee is a % of profit earned, reducing the net return
function commissionType(inv){return inv.commissionType||'cash';}
function commissionAmount(inv){
  const t=commissionType(inv);
  if(t==='pct_invested')return Number(inv.deployed||0)*Number(inv.commissionValue||0)/100;
  if(t==='pct_profit')return expectedProfit(inv)*Number(inv.commissionValue||0)/100;
  return Number(inv.commission||0);
}
function commissionLabel(inv){
  const t=commissionType(inv);
  if(t==='pct_invested')return inv.commissionValue+'% of Invested Amount';
  if(t==='pct_profit')return inv.commissionValue+'% of Profit';
  return'Upfront Cash';
}
// Net profit now reflects only the profit-share commission (deal-specific, unrelated to funding
// source) — not OD cost, which lives solely in the Capital pool's liabilities.
function netProfit(inv){
  const profitFee=commissionType(inv)==='pct_profit'?commissionAmount(inv):0;
  return expectedProfit(inv)-profitFee;
}
function netRoi(inv){return Number(inv.deployed)?netProfit(inv)/Number(inv.deployed)*100:0;}
function hasNetAdjustment(inv){return commissionType(inv)==='pct_profit';}

// LOANS — standard reducing-balance amortization
// Standard fixed monthly installment for a reducing-balance loan
function loanMonthlyInstallment(loan){
  const P=Number(loan.principal||0),r=Number(loan.rate||0)/100/12,n=Number(loan.termMonths||0);
  if(!P||!n)return 0;
  if(!r)return P/n;
  return P*r/(1-Math.pow(1+r,-n));
}
function loanPaymentsFor(loanId){
  return state.loanPayments.filter(p=>p.loanId===loanId).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
// Walks a loan's logged payments in date order, splitting each into principal/interest against the
// declining balance (interest = balance × monthly rate at the time of that payment).
// Interest accrues daily on the outstanding balance (annual rate ÷ 365 × actual days elapsed),
// matching standard bank practice — not a flat "annual rate ÷ 12" per payment, which ignores that
// real payment dates rarely fall exactly 30/31 days apart.
function loanAmortizationLog(loan){
  const annualRate=Number(loan.rate||0)/100;
  let balance=Number(loan.principal||0);
  let prevDate=new Date(loan.drawDate);
  const rows=[];
  loanPaymentsFor(loan.id).forEach(p=>{
    const days=Math.max(0,(new Date(p.date)-prevDate)/86400000);
    const interest=+(balance*annualRate/365*days).toFixed(3);
    let principal=+(Number(p.amount)-interest).toFixed(3);
    if(principal>balance)principal=balance; // final payment safety
    balance=+(balance-principal).toFixed(3);
    rows.push({...p,interest,principal,balanceAfter:balance});
    prevDate=new Date(p.date);
  });
  return rows;
}
function loanOutstanding(loan){
  const rows=loanAmortizationLog(loan);
  return rows.length?rows[rows.length-1].balanceAfter:Number(loan.principal||0);
}
function loanInterestPaid(loan){
  return loanAmortizationLog(loan).reduce((s,r)=>s+r.interest,0);
}
// Interest accrued since the last logged payment (or since draw date if none logged), on the
// current outstanding balance — an estimate of financing cost not yet reflected in a real payment.
function loanAccruedSincePayment(loan){
  const rows=loanAmortizationLog(loan);
  const balance=loanOutstanding(loan);
  const since=rows.length?new Date(rows[rows.length-1].date):new Date(loan.drawDate);
  const days=Math.max(0,(new Date()-since)/86400000);
  return balance*(Number(loan.rate||0)/100)*days/365;
}

// ============ FREE CAPITAL POOL ============
// One shared cash pool, fed by Equity, OD, and Loan draws, and by deal payments coming back in;
// drawn down by deal capital going out and by loan/OD repayments. Deals never care where the
// money came from — that's the whole point.
function odUtilizedNow(){
  return(state.odFlows||[]).reduce((s,f)=>s+(f.type==='draw'?Number(f.amount):-Number(f.amount)),0);
}
// Time-weighted interest on the OD's utilized balance as it changed over time, accrued to today.
// OD interest isn't tied to discrete "payments" the way a loan is — it accrues continuously on
// whatever's drawn, the way a real overdraft line works.
function odInterestAccrued(){
  const flows=[...(state.odFlows||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let balance=0,lastDate=null,interest=0;
  const rate=Number(state.odRate||0)/100;
  flows.forEach(f=>{
    const dt=new Date(f.date);
    if(lastDate){const days=Math.max(0,(dt-lastDate)/86400000);interest+=balance*rate*days/365;}
    balance+=f.type==='draw'?Number(f.amount):-Number(f.amount);
    lastDate=dt;
  });
  if(lastDate){const days=Math.max(0,(new Date()-lastDate)/86400000);interest+=balance*rate*days/365;}
  return interest;
}
function poolTotalEquityIn(){return(state.equityFlows||[]).filter(f=>f.type==='injection').reduce((s,f)=>s+Number(f.amount),0);}
function poolTotalEquityOut(){return(state.equityFlows||[]).filter(f=>f.type==='withdrawal').reduce((s,f)=>s+Number(f.amount),0);}
function poolTotalLoanDrawn(){return state.loans.reduce((s,l)=>s+Number(l.principal||0),0);}
function poolTotalLoanPaid(){return(state.loanPayments||[]).reduce((s,p)=>s+Number(p.amount||0),0);}
function poolTotalLoanOutstanding(){return state.loans.reduce((s,l)=>s+loanOutstanding(l),0);}
function poolTotalLoanAccruedUnpaid(){return state.loans.reduce((s,l)=>s+loanAccruedSincePayment(l),0);}
function poolTotalOdDrawn(){return(state.odFlows||[]).filter(f=>f.type==='draw').reduce((s,f)=>s+Number(f.amount),0);}
function poolTotalOdRepaid(){return(state.odFlows||[]).filter(f=>f.type==='repayment').reduce((s,f)=>s+Number(f.amount),0);}
function poolAllDeals(){return state.portfolios.flatMap(p=>pData(p.id).investments.map(i=>({...i,_pid:p.id})));}
function poolTotalDeployedAllTime(){
  const now=new Date();
  return poolAllDeals().filter(i=>new Date(i.date)<=now).reduce((s,i)=>{
    const gross=Number(i.grossCapital||i.deployed);
    const cashCommission=commissionType(i)==='cash'?Number(i.commission||0):0;
    return s+gross+cashCommission;
  },0);
}
function poolTotalReceivedAllTime(){
  return state.portfolios.flatMap(p=>pData(p.id).payments).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
}
function poolTotalProfitReceived(){
  return state.portfolios.flatMap(p=>pData(p.id).payments).reduce((s,p)=>s+Number(p.profit||0),0);
}
// Current uninvested cash sitting in the pool. If negative, the ledger is incomplete — deals were
// funded with capital that was never logged as an Equity/OD/Loan inflow.
function freeCapitalBalance(){
  return poolTotalEquityIn()-poolTotalEquityOut()
    +poolTotalLoanDrawn()-poolTotalLoanPaid()
    +poolTotalOdDrawn()-poolTotalOdRepaid()
    -poolTotalDeployedAllTime()+poolTotalReceivedAllTime();
}
// Book value of capital still tied up in active deals (deployed minus principal already returned) —
// deliberately conservative: no markup for unrealized expected profit on open deals.
function poolActiveDealsBookValue(){
  const now=new Date();
  return poolAllDeals().filter(i=>effectiveStatus(i._pid,i)==='Active'&&new Date(i.date)<=now).reduce((s,i)=>s+principalOutstanding(i._pid,i),0);
}
function poolTotalAssets(){return freeCapitalBalance()+poolActiveDealsBookValue();}
function poolTotalLiabilities(){return poolTotalLoanOutstanding()+poolTotalLoanAccruedUnpaid()+odUtilizedNow()+odInterestAccrued();}
function poolEquityValue(){return poolTotalAssets()-poolTotalLiabilities();}

// XIRR — simple bisection solver on dated cash flows: [{amt, date}]
function xnpv(rate,flows){
  const base=flows.reduce((min,f)=>f.date<min?f.date:min,flows[0].date);
  return flows.reduce((s,f)=>s+f.amt/Math.pow(1+rate,(f.date-base)/86400000/365),0);
}
function solveXirr(flows){
  if(flows.length<2)return null;
  const hasNeg=flows.some(f=>f.amt<0),hasPos=flows.some(f=>f.amt>0);
  if(!hasNeg||!hasPos)return null;
  let lo=-0.99,hi=10;
  for(let i=0;i<200;i++){
    const mid=(lo+hi)/2;
    if(xnpv(mid,flows)>0)lo=mid;else hi=mid;
  }
  return(lo+hi)/2;
}
// Blended: every capital source (equity+loan+OD) treated as equal-cost. Payoff = total pool value
// (idle cash + book value of what's still deployed), regardless of who financed it.
function blendedXirr(){
  const flows=[];
  (state.equityFlows||[]).forEach(f=>flows.push({amt:f.type==='injection'?-Number(f.amount):Number(f.amount),date:new Date(f.date)}));
  (state.odFlows||[]).forEach(f=>flows.push({amt:f.type==='draw'?-Number(f.amount):Number(f.amount),date:new Date(f.date)}));
  state.loans.forEach(l=>flows.push({amt:-Number(l.principal),date:new Date(l.drawDate)}));
  (state.loanPayments||[]).forEach(p=>flows.push({amt:Number(p.amount),date:new Date(p.date)}));
  flows.push({amt:poolTotalAssets(),date:new Date()});
  return solveXirr(flows);
}
// True Equity: only your own money in/out, payoff = what's left after lenders are paid in full
// (principal + accrued interest) — the number that actually answers "how did MY money do."
function equityXirr(){
  const flows=[];
  (state.equityFlows||[]).forEach(f=>flows.push({amt:f.type==='injection'?-Number(f.amount):Number(f.amount),date:new Date(f.date)}));
  flows.push({amt:poolEquityValue(),date:new Date()});
  return solveXirr(flows);
}
// One-time helper: reconstructs the minimum equity injections that WOULD have been needed to fund
// every deal to date, assuming zero idle cash and excluding known Loan/OD-funded deals. Used only
// to suggest a starting point for backfilling historical Equity entries — never runs automatically.
function suggestHistoricalEquity(){
  const now=new Date();
  const events=[];
  poolAllDeals().forEach(i=>{
    if(new Date(i.date)>now)return;
    const gross=Number(i.grossCapital||i.deployed);
    const cashCommission=commissionType(i)==='cash'?Number(i.commission||0):0;
    events.push({date:new Date(i.date),type:'debit',amt:gross+cashCommission,label:i.company});
  });
  state.portfolios.forEach(p=>pData(p.id).payments.forEach(pay=>{
    const credit=Number(pay.principal||0)+Number(pay.profit||0);
    if(credit>0)events.push({date:new Date(pay.date),type:'credit',amt:credit,label:pay.company});
  }));
  (state.loans||[]).forEach(l=>events.push({date:new Date(l.drawDate),type:'credit',amt:Number(l.principal),label:l.name+' (loan draw)'}));
  (state.odFlows||[]).forEach(f=>events.push({date:new Date(f.date),type:f.type==='draw'?'credit':'debit',amt:Number(f.amount),label:'OD '+f.type}));
  events.sort((a,b)=>a.date-b.date||(a.type==='credit'?-1:1));
  let wallet=0;const suggestions=[];
  events.forEach(e=>{
    if(e.type==='credit'){wallet+=e.amt;}
    else{
      if(wallet<e.amt-0.01){const shortfall=e.amt-wallet;suggestions.push({date:e.date.toISOString().split('T')[0],amount:+shortfall.toFixed(2),label:'to fund '+e.label});wallet+=shortfall;}
      wallet-=e.amt;
    }
  });
  return suggestions;
}
// Auto-derived status: a deal is effectively Closed once principal + profit are both fully received,
// even if no one has manually flipped the status field. Manual "Closed" is always respected.
function effectiveStatus(pid,inv){
  if(inv.status==='Closed')return'Closed';
  return outstandingFor(pid,inv)<=0.01?'Closed':inv.status;
}
// True when principal is fully repaid but profit/interest is still outstanding
function profitPending(pid,inv){
  return principalOutstanding(pid,inv)<=0.01&&outstandingFor(pid,inv)>0.01;
}

// CONCENTRATION RISK
// Strips trailing sequence/repeat markers so repeat deals with the same borrower group together
// e.g. "Union Trading 1/2/3", "Complete Energy Services (2)", "Action Film Oman II"
const CONC_HIGH=25,CONC_MED=15; // % of active capital thresholds
function baseCompanyName(name){
  return String(name||'').trim()
    .replace(/\s*\(\d+\)\s*$/,'')
    .replace(/\s*#\d+\s*$/,'')
    .replace(/\s+\d+$/,'')
    .replace(/\s+(I{1,3}|IV|V)$/i,'')
    .trim()||String(name||'').trim();
}
function concentrationBand(pct){
  if(pct>=CONC_HIGH)return{label:'High',color:'var(--red)'};
  if(pct>=CONC_MED)return{label:'Medium',color:'var(--orange)'};
  return{label:'Low',color:'var(--green)'};
}
// Groups currently-active deployed capital by borrower (base company name).
// Only active exposure counts — capital already repaid is no longer at risk.
function concentrationGroups(invs){
  const activeInvs=invs.filter(i=>effectiveStatus(i._pid,i)==='Active');
  const total=activeInvs.reduce((s,i)=>s+Number(i.deployed),0);
  const map=new Map();
  activeInvs.forEach(i=>{
    const key=baseCompanyName(i.company);
    if(!map.has(key))map.set(key,{name:key,deployed:0,count:0});
    const g=map.get(key);
    g.deployed+=Number(i.deployed);
    g.count++;
  });
  return[...map.values()].map(g=>({...g,pct:total?g.deployed/total*100:0})).sort((a,b)=>b.deployed-a.deployed);
}

// TOTALS
function totalsFor(invs,pays,pid){
  const deployed=invs.reduce((s,i)=>s+Number(i.deployed),0);
  const expProfit=invs.reduce((s,i)=>s+expectedProfit(i),0);
  const actProfit=invs.reduce((s,i)=>s+actualProfit(i._pid||pid,i),0);
  const repaid=pays.reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
  return{
    deployed,
    annualProfit:invs.reduce((s,i)=>s+(Number(i.deployed)*Number(i.roi)/100),0),
    expProfit,
    actProfit,
    hasCommissionAdj:invs.some(i=>commissionType(i)==='pct_profit'),
    netExpProfit:invs.reduce((s,i)=>s+netProfit(i),0),
    repaid,
    avgExpRoi:deployed?expProfit/deployed*100:0,
    avgActRoi:repaid?actProfit/repaid*100:0,
    active:invs.filter(i=>effectiveStatus(i._pid||pid,i)==='Active').length,
    total:invs.length,
  };
}
function payStatusSummaryFor(pid,invs){
  const g={'No Payment':[],'Partial Payment':[],'Full Payment':[]};
  invs.forEach(inv=>g[paymentStatus(pid,inv)].push(inv));
  return['No Payment','Partial Payment','Full Payment'].map(label=>{
    const a=g[label];
    return{label,count:a.length,
      totalOutstanding:a.reduce((s,i)=>s+outstandingFor(pid,i),0),
      totalReceived:a.reduce((s,i)=>s+invPaymentsFor(pid,i.id).reduce((ss,p)=>ss+Number(p.principal||0)+Number(p.profit||0),0),0),
    };
  });
}

// RENDER
function render(){
  const active=document.activeElement;
  const activeId=active&&active.id;
  const selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
  const selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  const viewEl=document.getElementById('view');
  const scrollTop=viewEl?viewEl.scrollTop:0;
  Object.values(rptChartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  rptChartInstances={};
  Object.values(anlChartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  anlChartInstances={};
  renderPortBar();renderTopNav();renderView();renderFab();
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null&&el.setSelectionRange){try{el.setSelectionRange(selStart,selEnd);}catch(e){}}
    }
  }
  const newViewEl=document.getElementById('view');
  if(newViewEl)newViewEl.scrollTop=scrollTop;
}

  const pays=invPaymentsFor(pid,inv.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalPaid=pays.reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0),out=outstandingFor(pid,inv),pinfo=pInfo(pid);
  const mat=maturityDate(inv),overdue=isOverdue(inv,pid),pending=profitPending(pid,inv),isOd=hasNetAdjustment(inv),cType=commissionType(inv),commAmt=commissionAmount(inv);
  const metrics=[];
  if(cType==='pct_invested')metrics.push({label:'Capital Committed (Gross)',val:fmt(inv.grossCapital||inv.deployed),color:'var(--gold-light)'});
  metrics.push({label:cType==='pct_invested'?'Capital Deployed (Net)':'Capital Deployed',val:fmt(inv.deployed),color:'var(--gold-light)'});
  metrics.push(
    {label:'Duration',val:fmtDuration(inv.duration),color:'var(--text)'},

// REPORTS
function getReportData(){
  let invs=state.portfolios.flatMap(p=>pData(p.id).investments.map(i=>({...i,_pid:p.id,_pname:pInfo(p.id).name,_pcolor:pInfo(p.id).color})));
  if(rptFilters.portfolio!=='all') invs=invs.filter(i=>i._pid===rptFilters.portfolio);
  if(rptFilters.year!=='all') invs=invs.filter(i=>new Date(i.date).getFullYear()===parseInt(rptFilters.year));
  if(rptFilters.payStatus!=='all') invs=invs.filter(i=>paymentStatus(i._pid,i)===rptFilters.payStatus);
  if(rptFilters.fundSource!=='all') invs=invs.filter(i=>i.fundSource===rptFilters.fundSource);
  if(rptFilters.returnYear!=='all'){
    invs=invs.filter(i=>{
      const end=new Date(new Date(i.date).getTime()+Number(i.duration||0)*30.44*24*3600*1000);
      return end.getFullYear()===parseInt(rptFilters.returnYear);
    });
  }
  return invs;
}

}

function initReportCharts(){
  const invs=getReportData();

  const gc='rgba(48,54,61,0.8)';

  const c1=document.getElementById('chart-bar');
  if(c1) rptChartInstances.bar=new Chart(c1,{type:'bar',data:{labels:bY,datasets:[{data:bY.map(y=>byYear[y]),backgroundColor:'#C9A84C99',borderRadius:6,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' OMR '+ctx.raw.toLocaleString()}}},scales:{x:{grid:{color:gc}},y:{grid:{color:gc},ticks:{callback:v=>'OMR '+Number(v).toLocaleString()}}}}});
  // Donut - payment status

  const c2=document.getElementById('chart-donut');
  if(c2) rptChartInstances.donut=new Chart(c2,{type:'doughnut',data:{labels:Object.keys(psC),datasets:[{data:Object.values(psC),backgroundColor:['#484F58','#58A6FF','#3FB950'],borderColor:'#0D1117',borderWidth:3}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{padding:16,boxWidth:12}}}}});
  // Horizontal bar - ROI per deal
  const top=invs.slice().sort((a,b)=>expectedRoi(b)-expectedRoi(a)).slice(0,15);
  const c3=document.getElementById('chart-roi');
  if(c3) rptChartInstances.roi=new Chart(c3,{type:'bar',data:{labels:top.map(i=>i.company.length>18?i.company.slice(0,16)+'…':i.company),datasets:[{data:top.map(i=>+expectedRoi(i).toFixed(2)),backgroundColor:top.map(i=>i._pcolor+'CC'),borderRadius:4,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw}%`}}},scales:{x:{grid:{color:gc},ticks:{callback:v=>v+'%'}},y:{grid:{color:'transparent'},ticks:{font:{size:10}}}}}});
  // Line - cumulative
  const ap=invs.flatMap(i=>invPaymentsFor(i._pid,i.id)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  let cum=0;const ll=[],ld=[];
  ap.forEach(p=>{cum+=Number(p.principal||0)+Number(p.profit||0);ll.push(fmtDate(p.date));ld.push(+cum.toFixed(2));});
  const c4=document.getElementById('chart-line');
  if(c4) rptChartInstances.line=new Chart(c4,{type:'line',data:{labels:ll,datasets:[{label:'Cumulative (OMR)',data:ld,borderColor:'#C9A84C',backgroundColor:'rgba(201,168,76,0.1)',borderWidth:2,pointRadius:3,pointBackgroundColor:'#C9A84C',tension:0.3,fill:true}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' OMR '+ctx.raw.toLocaleString()}}},scales:{x:{grid:{color:gc},ticks:{maxRotation:45,font:{size:9}}},y:{grid:{color:gc},ticks:{callback:v=>'OMR '+Number(v).toLocaleString()}}}}});
}

// MODALS
// Truncates a long list of pre-rendered row HTML to state.capitalRowLimit, with a
// Show More / Show Less toggle. key identifies this list so its expand state persists
// across re-renders (e.g. 'equity', 'od', or a loan id for its payment list).
function limitedListHTML(rowsHtml,key){
  const limit=Math.max(1,Number(state.capitalRowLimit||7));
  if(rowsHtml.length<=limit)return rowsHtml.join('');
  const expanded=capitalListExpanded.has(key);
  const shown=expanded?rowsHtml:rowsHtml.slice(0,limit);
  const hiddenCount=rowsHtml.length-limit;
  return shown.join('')
    +'<button onclick="toggleCapitalList(\''+key+'\')" style="width:100%;background:transparent;border:none;border-top:1px solid var(--border);color:var(--gold);font-size:12px;font-weight:600;padding:10px 0;cursor:pointer">'
    +(expanded?'Show Less':'Show '+hiddenCount+' More')+'</button>';
}
function toggleCapitalList(key){
  if(capitalListExpanded.has(key))capitalListExpanded.delete(key);else capitalListExpanded.add(key);
  render();
}
function updateCapitalRowLimit(v){
  const n=parseInt(v);
  if(isNaN(n)||n<1){showToast('Enter a valid number',true);return;}
  state.capitalRowLimit=n;
  capitalListExpanded.clear();
  saveState();render();
}
function showModal(h){const m=document.getElementById('modal');m.style.display='flex';m.innerHTML=`<div class="modal" onclick="event.stopPropagation()">${h}</div>`;m.onclick=closeModal;}
function closeModal(){document.getElementById('modal').style.display='none';}

function savePortfolio(){

// Pre-commitment concentration check: shows what exposure to this borrower (and the
// portfolio's overall concentration) would look like if this deal is saved as entered.
// excludeId lets the Edit form ignore the deal's own current amount when recomputing "existing" exposure.
function updateConcentrationPreview(excludeId){
  const box=document.getElementById('conc-preview');
  if(!box)return;
  const pidEl=document.getElementById('m-pid'),companyEl=document.getElementById('m-company'),depEl=document.getElementById('m-deployed');
  if(!pidEl||!companyEl||!depEl)return;
  const pid=pidEl.value,company=companyEl.value.trim(),deployed=parseFloat(depEl.value);
  if(!company||isNaN(deployed)||deployed<=0){box.innerHTML='';return;}
  const base=baseCompanyName(company);
  const existing=pData(pid).investments.filter(i=>effectiveStatus(pid,i)==='Active'&&(excludeId==null||i.id!==excludeId));
  const existingTotal=existing.reduce((s,i)=>s+Number(i.deployed),0);
  const sameCompany=existing.filter(i=>baseCompanyName(i.company)===base);
  const existingCompany=sameCompany.reduce((s,i)=>s+Number(i.deployed),0);
  const newTotal=existingTotal+deployed;
  const newCompanyExposure=existingCompany+deployed;
  const pct=newTotal?newCompanyExposure/newTotal*100:0;
  const band=concentrationBand(pct);
  box.innerHTML='<div style="background:'+band.color+'11;border:1px solid '+band.color+'55;border-radius:10px;padding:10px 12px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'
    +'<div style="color:var(--text);font-size:12px;font-weight:600">Concentration if committed</div>'
    +'<span class="badge" style="background:'+band.color+'22;color:'+band.color+';border-color:'+band.color+'66">'+pct.toFixed(1)+'% · '+band.label+'</span>'
    +'</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-top:4px">'+base+(sameCompany.length?' already has '+fmt(existingCompany)+' deployed across '+sameCompany.length+' active deal'+(sameCompany.length>1?'s':'')+'. ':' has no prior active exposure. ')
    +'This deal would bring it to '+fmt(newCompanyExposure)+' — '+pct.toFixed(1)+'% of '+fmt(newTotal)+' total active capital.</div>'
    +(band.label==='High'?'<div style="color:var(--red);font-size:11px;margin-top:6px;font-weight:600">⚠ This exceeds the '+CONC_HIGH+'% concentration threshold — consider reducing the size or declining.</div>':'')
    +'</div>';
}

function toggleCommissionFields(){
  const type=document.getElementById('m-comm-type').value;
  const cash=document.getElementById('comm-cash-fields'),pi=document.getElementById('comm-pctinv-fields'),pp=document.getElementById('comm-pctprofit-fields');
  if(cash)cash.style.display=type==='cash'?'block':'none';

// Resolves the three commission modes into what actually gets stored: deployed (net, ROI-earning,
// always exactly what's entered as Capital), grossCapital (only set for pct_invested — net +
// commission, computed automatically), commission (flat OMR, only for cash), commissionValue (%).
function readCommissionFields(enteredCapital){
  const type=document.getElementById('m-comm-type').value;
  let deployed=enteredCapital,grossCapital=null,commission=0,commissionValue=0;
  if(type==='pct_invested'){
    commissionValue=parseFloat(document.getElementById('m-comm-pct-invested').value)||0;
    grossCapital=+(deployed*(1+commissionValue/100)).toFixed(2);
  }else if(type==='pct_profit'){
    commissionValue=parseFloat(document.getElementById('m-comm-pct-profit').value)||0;
  }else{
    commission=parseFloat(document.getElementById('m-commission').value)||0;
  }
  return{deployed,grossCapital,commission,commissionType:type,commissionValue};
}

function csvEscape(v){
  const s=v===null||v===undefined?'':String(v);
  return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadFile(filename,content,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// MATURITY REMINDERS (.ics)
function icsDate(d){return d.toISOString().split('T')[0].replace(/-/g,'');}
function exportMaturityReminders(){
  const now=new Date();
  const events=[];
  state.portfolios.forEach(p=>{
    pData(p.id).investments.forEach(inv=>{
      if(effectiveStatus(p.id,inv)!=='Active')return;
      const mat=maturityDate(inv);
      if(!mat)return;
      const out=outstandingFor(p.id,inv);
      events.push({uid:'deal-'+p.id+'-'+inv.id+'@investment-tracker',date:mat,summary:'Deal Maturity: '+inv.company+' ('+p.name+')',desc:'Outstanding: '+fmt(out)+'. Capital: '+fmt(inv.deployed)+' at '+inv.roi+'% p.a.'});
    });
  });
  if(!events.length){showToast('No active deals with a maturity date',true);return;}
  const stamp=icsDate(now)+'T000000Z';
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Investment Portfolio Tracker//EN\r\nCALSCALE:GREGORIAN\r\n';
  events.forEach(ev=>{
    const dtStart=new Date(ev.date);
    const dtEnd=new Date(dtStart.getTime()+86400000);
    ics+='BEGIN:VEVENT\r\nUID:'+ev.uid+'\r\nDTSTAMP:'+stamp+'\r\nDTSTART;VALUE=DATE:'+icsDate(dtStart)+'\r\nDTEND;VALUE=DATE:'+icsDate(dtEnd)+'\r\nSUMMARY:'+ev.summary+'\r\nDESCRIPTION:'+ev.desc+'\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Deal maturing soon\r\nTRIGGER:-P7D\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  downloadFile('deal-maturity-reminders.ics',ics,'text/calendar');
  showToast(events.length+' reminder'+(events.length!==1?'s':'')+' downloaded ✓');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const p=JSON.parse(ev.target.result);
      const inc=p.data||p;
      if(!inc.portfolios){showToast('Invalid backup file',true);return;}
      window._pi=inc;
      showModal(`<div class="modal-handle"></div><div class="modal-title">Import Backup?</div><div style="color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:20px">This backup contains <b style="color:var(--text)">${inc.portfolios.length} portfolios</b>.<br><br><b style="color:var(--red)">All current data will be replaced.</b></div><button class="btn btn-gold" onclick="doImport()">Yes, Import</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`);
    }catch(err){showToast('Could not read file',true);}
  };
  r.readAsText(file);e.target.value='';
}

let anlChartInstances = {};

function getAllInvestments(){
  return state.portfolios.flatMap(p =>
    pData(p.id).investments.map(i => ({...i,_pid:p.id,_pname:pInfo(p.id).name,_pcolor:pInfo(p.id).color}))
  );
}
function getAllPayments(){
  return state.portfolios.flatMap(p =>
    pData(p.id).payments.map(pay => ({...pay,_pid:p.id}))
  );
}
// Scoped to whatever the Analytics tab is currently showing (All Portfolios vs one portfolio).
// Shared by analyticsHTML() and by targeted partial refreshes (toggles) so they never drift apart.
function analyticsScopedInv(){
  return currentPortfolio==='all'
    ?getAllInvestments()
    :pData(currentPortfolio).investments.map(i=>({...i,_pid:currentPortfolio,_pname:pInfo(currentPortfolio).name,_pcolor:pInfo(currentPortfolio).color}));
}
function analyticsScopedPay(){
  return currentPortfolio==='all'
    ?getAllPayments()
    :pData(currentPortfolio).payments.map(p=>({...p,_pid:currentPortfolio}));
}
function maturityDate(inv){
  if(!inv.date||!inv.duration) return null;
  const d=new Date(inv.date);
  d.setMonth(d.getMonth()+Number(inv.duration));
  return d;
}
function isOverdue(inv,pid){
  pid=pid||inv._pid;
  const m=maturityDate(inv);
  return m&&m<new Date()&&principalOutstanding(pid,inv)>0&&effectiveStatus(pid,inv)==='Active';
}
function collectionRate(inv){
  const expected=Number(inv.deployed)+expectedProfit(inv);
  const received=invPaymentsFor(inv._pid,inv.id).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
  return expected>0?Math.min(100,(received/expected)*100):0;
}
function ragColor(pct){
  if(pct>=75) return 'var(--green)';
  if(pct>=30) return 'var(--gold)';
  return 'var(--red)';
}
function kpiCard(label,value,color){
  return '<div class="stat-card">'
    +'<div style="font-size:18px;font-weight:800;color:'+color+';line-height:1.1">'+value+'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+label+'</div>'
    +'</div>';
}

function analyticsHTML(){
  const isAll=currentPortfolio==='all';
  const ports=isAll?state.portfolios:state.portfolios.filter(p=>p.id===currentPortfolio);
  const allInv=analyticsScopedInv();
  const allPay=analyticsScopedPay();
  const totalDeployed=allInv.reduce((s,i)=>s+Number(i.deployed),0);
  const totalExpProfit=allInv.reduce((s,i)=>s+expectedProfit(i),0);
  const totalExpReturn=totalDeployed+totalExpProfit;
  const totalReceived=allPay.reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
  const totalOutstanding=allInv.reduce((s,i)=>s+outstandingFor(i._pid,i),0);
  const weightedRoi=allInv.length?allInv.reduce((s,i)=>s+Number(i.roi)*Number(i.deployed),0)/totalDeployed:0;
  const collRate=totalExpReturn>0?(totalReceived/totalExpReturn*100):0;
  const activeCount=allInv.filter(i=>effectiveStatus(i._pid,i)==='Active').length;
  const overdueList=allInv.filter(i=>isOverdue(i));

  // Scorecard

    +kpiCard('Outstanding',fmt(totalOutstanding),'var(--blue)')
    +kpiCard('Weighted Avg ROI',weightedRoi.toFixed(1)+'%','var(--gold)')

        +'</tr>';

    +'</table></div>';

  // Maturity schedule
  const upcoming=allInv
    .filter(i=>effectiveStatus(i._pid,i)==='Active'&&maturityDate(i))

    .sort((a,b)=>a._mat-b._mat)

}
// Standalone so the Actual/Forecast toggle can rebuild just this one chart without touching
// (or destroying) any of the other charts on the page.
function renderMonthlyChart(){
  const allInv=analyticsScopedInv();
  const allPay=analyticsScopedPay();
  const gc='rgba(48,54,61,0.8)';
  const now0=new Date();
  const monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const monthLbl=d=>d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
  let mLabels,mValues,mColor;
  if(anlMonthlyMode==='forecast'){
    const months=[];for(let i=0;i<12;i++)months.push(new Date(now0.getFullYear(),now0.getMonth()+i,1));
    const buckets={};months.forEach(m=>buckets[monthKey(m)]=0);
    const firstKey=monthKey(months[0]),lastMonthStart=months[0];
    allInv.forEach(inv=>{
      if(effectiveStatus(inv._pid,inv)!=='Active')return;
      const out=outstandingFor(inv._pid,inv);
      if(out<=0.01)return;
      const mat=maturityDate(inv);
      if(!mat)return;
      if(mat<lastMonthStart){buckets[firstKey]+=out;return;}
      const key=monthKey(mat);
      if(buckets[key]!==undefined)buckets[key]+=out;
    });
    mLabels=months.map(m=>monthLbl(m));
    mValues=months.map(m=>+buckets[monthKey(m)].toFixed(2));
    mColor='#C9A84C88';
  }else{
    const months=[];for(let i=11;i>=0;i--)months.push(new Date(now0.getFullYear(),now0.getMonth()-i,1));
    const monthly={};
    allPay.filter(p=>Number(p.principal||0)+Number(p.profit||0)>0).forEach(p=>{
      const key=p.date.slice(0,7);
      monthly[key]=(monthly[key]||0)+Number(p.principal||0)+Number(p.profit||0);
    });
    mLabels=months.map(m=>monthLbl(m));
    mValues=months.map(m=>+((monthly[monthKey(m)]||0).toFixed(2)));
    mColor='#58A6FF88';
  }
  const c6=document.getElementById('anl-monthly');
  if(c6){
    if(anlChartInstances.monthly){try{anlChartInstances.monthly.destroy();}catch(e){}}
    anlChartInstances.monthly=new Chart(c6,{type:'bar',data:{
      labels:mLabels,
      datasets:[{data:mValues,backgroundColor:mColor,borderRadius:4,borderSkipped:false}]
    },options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' OMR '+ctx.raw.toLocaleString()}}},
      scales:{x:{grid:{color:gc},ticks:{font:{size:9}}},y:{grid:{color:gc},ticks:{callback:v=>'OMR '+Number(v).toLocaleString()}}}}});
  }
}

function cashFlowBuckets(invs){
  const now=new Date();
  const b={overdue:0,d0_30:0,d31_60:0,d61_90:0,beyond90:0};
  const items={overdue:[],d0_30:[],d31_60:[],d61_90:[],beyond90:[]};
  invs.forEach(i=>{
    if(effectiveStatus(i._pid,i)!=='Active')return;
    const out=outstandingFor(i._pid,i);
    if(out<=0.01)return;
    const mat=maturityDate(i);
    let key;
    if(!mat)key='beyond90';
    else{
      const days=Math.ceil((mat-now)/86400000);
      key=days<0?'overdue':days<=30?'d0_30':days<=60?'d31_60':days<=90?'d61_90':'beyond90';
    }
    b[key]+=out;
    items[key].push({inv:i,out,mat});
  });
  Object.keys(items).forEach(k=>items[k].sort((a,b2)=>b2.out-a.out));
  return{buckets:b,items};
}

    {key:'d61_90',label:'61–90 Days',val:b.d61_90,color:'var(--purple)'},
    {key:'beyond90',label:'Beyond 90 Days',val:b.beyond90,color:'var(--muted)'},
  ];
  const max=Math.max(1,...rows.map(r=>r.val));
  if(rows.every(r=>r.val<=0))return'<div class="empty">Nothing outstanding on active deals</div>';
  return rows.map(r=>{
    const open=cfExpanded.has(r.key);
    const list=items[r.key];
    const detail=open?'<div style="margin-top:8px;padding-top:2px;padding-left:14px;margin-left:4px;border-left:2px solid '+r.color+'44">'+(list.length?list.map(it=>
      '<div onclick="event.stopPropagation();openDetail('+it.inv.id+',\''+it.inv._pid+'\')" style="display:flex;justify-content:space-between;align-items:center;padding:6px 0 6px 8px;border-top:1px solid var(--border);cursor:pointer">'

// COLLECTIONS / AGING
// Two focused lists for follow-up: deals already past maturity with money still outstanding,
// and deals maturing within 30 days that still have an outstanding balance (early warning).
function collectionsList(invs){
  const now=new Date();
  const overdue=[],upcoming=[];
  invs.forEach(i=>{
    if(effectiveStatus(i._pid,i)!=='Active')return;
    const out=outstandingFor(i._pid,i);
    const mat=maturityDate(i);
    if(out<=0.01||!mat)return;
    const days=Math.ceil((mat-now)/86400000);
    if(days<0)overdue.push({...i,_days:days,_out:out});
    else if(days<=30)upcoming.push({...i,_days:days,_out:out});
  });
  overdue.sort((a,b)=>a._days-b._days);
  upcoming.sort((a,b)=>a._days-b._days);
  return{overdue,upcoming};
}
function collectionsHTML(list){
  const row=i=>{
    const late=i._days<0;
    const band=late?'var(--red)':'var(--gold)';
    const label=late?Math.abs(i._days)+'d overdue':i._days+'d left';
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openDetail(${i.id},'${i._pid}')">
      <div><div style="color:var(--text);font-size:13px;font-weight:600">${i.company}</div>
      <div style="color:var(--muted);font-size:11px">${i._pname||pInfo(i._pid).name} · ${fmtMonthYear(maturityDate(i))}</div></div>
      <div style="text-align:right"><div style="color:var(--gold);font-size:13px;font-weight:700">${fmt(i._out)}</div>
      <div style="color:${band};font-size:11px">${label}</div></div></div>`;
  };
  let html='';
  if(list.overdue.length)html+='<div style="color:var(--red);font-size:12px;font-weight:700;margin-bottom:4px">⚠ Overdue ('+list.overdue.length+')</div>'+list.overdue.map(row).join('');
  if(list.upcoming.length)html+='<div style="color:var(--gold);font-size:12px;font-weight:700;margin:'+(list.overdue.length?'14px':'0')+' 0 4px">Maturing in 30 Days ('+list.upcoming.length+')</div>'+list.upcoming.map(row).join('');
  if(!list.overdue.length&&!list.upcoming.length)html='<div class="empty">Nothing overdue or maturing soon</div>';
  return html;
}

// DATA HEALTH — duplicate & anomaly detection
// Scans across all portfolios and flags things worth double-checking: possible duplicate
// entries, overpayments vs. expected return, orphaned payments, and missing/invalid fields.
function dataHealthChecks(){
  const issues=[];
  const allInv=[];
  state.portfolios.forEach(p=>{
    pData(p.id).investments.forEach(inv=>allInv.push({...inv,_pid:p.id,_pname:p.name}));
  });

  // Possible duplicate deals: same portfolio, same company, same start date
  const seen=new Map();
  allInv.forEach(inv=>{
    const key=inv._pid+'|'+(inv.company||'').trim().toLowerCase()+'|'+inv.date;
    if(!seen.has(key))seen.set(key,[]);
    seen.get(key).push(inv);
  });
  seen.forEach(group=>{
    if(group.length>1){
      issues.push({severity:'warning',pid:group[0]._pid,invId:group[0].id,
        message:group.length+' deals with identical company + start date in '+group[0]._pname+': "'+group[0].company+'" on '+fmtDate(group[0].date)+'. Could be a duplicate entry.'});
    }
  });

  // Overpayment: total received exceeds expected total return
  allInv.forEach(inv=>{
    const totalPaid=invPaymentsFor(inv._pid,inv.id).reduce((s,p)=>s+Number(p.principal||0)+Number(p.profit||0),0);
    const expTotal=Number(inv.deployed)+expectedProfit(inv);
    if(totalPaid>expTotal+0.5){
      issues.push({severity:'error',pid:inv._pid,invId:inv.id,
        message:'"'+inv.company+'" ('+inv._pname+') has received '+fmtHealth(totalPaid)+', more than its expected total return of '+fmtHealth(expTotal)+'. Delta: '+fmtHealth(totalPaid-expTotal)+'. Check for a data entry mistake.'});
    }
  });

  // Residual balance: deal looks essentially fully collected (rounds to 100% in the UI) but a
  // small non-zero amount remains outstanding — this is exactly what keeps it Active/Overdue
  // instead of auto-closing, and it's invisible unless shown unrounded.
  allInv.forEach(inv=>{
    if(effectiveStatus(inv._pid,inv)!=='Active')return;
    const out=outstandingFor(inv._pid,inv);
    if(out>0&&out<=Math.max(1,Number(inv.deployed)*0.02)){
      const late=isOverdue(inv,inv._pid);
      issues.push({severity:late?'error':'warning',pid:inv._pid,invId:inv.id,
        message:'"'+inv.company+'" ('+inv._pname+') is '+(late?'OVERDUE with':'nearly fully collected —')+' an exact outstanding balance of '+fmtHealth(out)+' (rounds to 100% in the Collected column, so it looks done but is not). Add or correct a payment to close it out.'});
    }
  });

  // Closed but principal not fully recovered: the deal auto-closes because total money in
  // (principal + profit combined) meets the total expected, but the principal-specific tracker
  // still shows a shortfall — meaning some of what came in was booked as profit when part of it
  // may actually be principal, or vice versa. Worth checking regardless of how small the gap is.
  allInv.forEach(inv=>{
    if(effectiveStatus(inv._pid,inv)!=='Closed')return;
    const pOut=principalOutstanding(inv._pid,inv);
    if(pOut>0.01){
      const actProf=actualProfit(inv._pid,inv),expProf=expectedProfit(inv);
      issues.push({severity:'warning',pid:inv._pid,invId:inv.id,
        message:'"'+inv.company+'" ('+inv._pname+') shows Closed overall, but '+fmtHealth(pOut)+' of principal is technically still outstanding — offset by profit received ('+fmtHealth(actProf)+') running ahead of expected ('+fmtHealth(expProf)+'). Check whether a payment was logged under the wrong category (principal vs profit).'});
    }
  });

  // Missing / invalid core fields
  allInv.forEach(inv=>{
    const probs=[];
    if(!inv.company||!inv.company.trim())probs.push('missing company name');
    if(!(Number(inv.deployed)>0))probs.push('invalid capital amount');
    if(!(Number(inv.roi)>0))probs.push('missing or zero ROI');
    if(!(Number(inv.duration)>0))probs.push('missing duration');
    if(!inv.date)probs.push('missing start date');
    if(probs.length){
      issues.push({severity:'warning',pid:inv._pid,invId:inv.id,
        message:'"'+(inv.company||'Unnamed deal')+'" ('+inv._pname+'): '+probs.join(', ')+'.'});
    }
  });

  // Orphaned payments: reference an investmentId that no longer exists
  state.portfolios.forEach(p=>{
    const pd=pData(p.id);
    const validIds=new Set(pd.investments.map(i=>i.id));
    pd.payments.forEach(pay=>{
      if(!validIds.has(pay.investmentId)){
        issues.push({severity:'error',pid:p.id,invId:null,
          message:'Payment of '+fmtHealth(Number(pay.principal||0)+Number(pay.profit||0))+' on '+fmtDate(pay.date)+' in '+p.name+' references a deal that no longer exists (possibly deleted).'});
      }
    });
  });

  return issues;
}
function dataHealthHTML(){
  const issues=dataHealthChecks();
  if(!issues.length)return'<div style="color:var(--green);font-size:13px;font-weight:600">✓ No issues found — data looks clean.</div>';
  const errs=issues.filter(i=>i.severity==='error'),warns=issues.filter(i=>i.severity==='warning');
  const row=i=>{
    const color=i.severity==='error'?'var(--red)':'var(--orange)';
    const clickable=i.invId!=null;
    return`<div style="padding:8px 0;border-bottom:1px solid var(--border);${clickable?'cursor:pointer':''}"${clickable?` onclick="openDetail(${i.invId},'${i.pid}')"`:''}>
      <div style="display:flex;gap:6px;align-items:flex-start">
        <span style="color:${color};font-size:12px;flex-shrink:0">●</span>
        <div style="color:var(--text);font-size:12px;line-height:1.5">${i.message}</div>
      </div></div>`;
  };
  return'<div style="color:var(--muted);font-size:12px;margin-bottom:10px">'+errs.length+' issue'+(errs.length!==1?'s':'')+' to fix · '+warns.length+' item'+(warns.length!==1?'s':'')+' worth checking</div>'
    +issues.map(row).join('');
}

// ═══════════════════════════════════════════════════════════════
const PWD_KEY = 'ipt_pwd_v1';
const DEFAULT_PWD = '1234Abc';
let _unlocked = false;

function hashPwd(pwd){
  // Simple deterministic hash — good enough for local app privacy
  let h = 0;
  for(let i = 0; i < pwd.length; i++){
    h = Math.imul(31, h) + pwd.charCodeAt(i) | 0;
  }
  return 'h' + Math.abs(h).toString(36);
}

function getStoredHash(){
  return localStorage.getItem(PWD_KEY) || hashPwd(DEFAULT_PWD);
}

function doUnlock(){
  const inp = document.getElementById('lock-input');
  const err = document.getElementById('lock-error');
  const val = inp.value;
  if(!val){ err.textContent = 'Please enter your password'; return; }
  if(hashPwd(val) === getStoredHash()){
    _unlocked = true;
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    err.textContent = '';
    render();
  } else {
    err.textContent = 'Incorrect password — try again';
    inp.value = '';
    inp.classList.add('shake');
    setTimeout(() => inp.classList.remove('shake'), 500);
    inp.focus();
  }
}

function toggleLockEye(){
  const inp = document.getElementById('lock-input');

  if(inp.type === 'password'){
    inp.type = 'text';

}

function changePassword(oldPwd, newPwd, confirmPwd){
  if(hashPwd(oldPwd) !== getStoredHash()){
    showToast('Current password is incorrect', true); return;
  }
  if(!newPwd || newPwd.length < 4){
    showToast('New password must be at least 4 characters', true); return;
  }
  if(newPwd !== confirmPwd){
    showToast('New passwords do not match', true); return;
  }
  localStorage.setItem(PWD_KEY, hashPwd(newPwd));
  closeModal();
  showToast('Password changed ✓');
}

// ─── PAYMENT DATA MIGRATION ───────────────────────────────────────────────────
// Converts old {amount, type} records to new {principal, profit} unified records
// Runs once on startup if old format detected
function migratePaymentsIfNeeded(){
  let migrated=false;
  state.portfolios.forEach(p=>{
    const pd=pData(p.id);
    if(!pd.payments||pd.payments.length===0) return;
    // Check if any payment uses old format (has 'type' field)
    if(!pd.payments.some(pay=>'type' in pay)) return;
    // Group by investmentId+date and merge
    const groups={};
    const order=[];
    pd.payments.forEach(pay=>{
      const key=pay.investmentId+'|'+pay.date;
      if(!groups[key]){
        groups[key]={investmentId:pay.investmentId,company:pay.company,
          principal:0,profit:0,date:pay.date,notes:''};
        order.push(key);
      }
      const amt=Number(pay.amount||0);
      if(pay.type==='Principal') groups[key].principal=+(groups[key].principal+amt).toFixed(2);
      else groups[key].profit=+(groups[key].profit+amt).toFixed(2);
      const note=(pay.notes||'').replace('(profit)','').replace(/^profit$/,'').trim();
      if(note&&!groups[key].notes) groups[key].notes=note;
    });
    pd.payments=order.map((key,i)=>({id:i+1,...groups[key]}));
    pd.nextPayId=pd.payments.length+1;
    migrated=true;
  });
  if(migrated){saveState();console.log('Payment data migrated to unified format');}
}

// App starts locked — render() called after unlock
migratePaymentsIfNeeded();
</script>
